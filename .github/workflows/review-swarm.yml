name: Review swarm

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: review-swarm-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    # Ordering invariant: 75-minute job > 65-minute poll > 60-minute swarm.
    timeout-minutes: 75
    steps:
      - name: Check out PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: review-target
          fetch-depth: 0

      - name: Check out immutable gate from main
        uses: actions/checkout@v4
        with:
          ref: main
          path: review-gate
          sparse-checkout: |
            workflows/review-swarm.yaml
            .github/workflows/scripts

      - name: Validate cloud authentication
        env:
          RELAY_WORKSPACE_KEY: ${{ secrets.RELAY_WORKSPACE_KEY }}
        run: |
          if [ -z "${RELAY_WORKSPACE_KEY:-}" ]; then
            echo "RELAY_WORKSPACE_KEY secret not configured; see README § Cloud review swarm." >&2
            exit 1
          fi

      - name: Install Agent Relay
        run: npm install --global agent-relay

      - name: Prepare review input
        env:
          GH_TOKEN: ${{ github.token }}
        run: review-gate/.github/workflows/scripts/swarm-prepare.sh "${{ github.event.pull_request.number }}" review-target review-gate

      - name: Launch cloud swarm
        id: launch
        working-directory: review-target
        env:
          RELAY_WORKSPACE_KEY: ${{ secrets.RELAY_WORKSPACE_KEY }}
        run: |
          response=$(agent-relay cloud run \
            "$GITHUB_WORKSPACE/review-gate/workflows/review-swarm.yaml" \
            --sync-code --json)
          run_id=$(jq -r '.run_id // .runId // .id // empty' <<< "$response")
          if [ -z "$run_id" ]; then
            echo "cloud launch returned no run id: $response" >&2
            exit 1
          fi
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"

      - name: Wait for terminal cloud status
        id: wait
        env:
          RELAY_WORKSPACE_KEY: ${{ secrets.RELAY_WORKSPACE_KEY }}
        run: |
          # Ordering invariant: 65-minute poll > 60-minute swarm, < 75-minute job.
          deadline=$((SECONDS + 3900))
          swarm_status=timed_out
          while [ "$SECONDS" -lt "$deadline" ]; do
            response=$(agent-relay cloud status "${{ steps.launch.outputs.run_id }}" --json 2>/dev/null) || response='{}'
            status=$(jq -r '.status // empty' <<< "$response")
            case "$status" in
              completed|failed|canceled|cancelled|interrupted)
                swarm_status=$status
                break
                ;;
            esac
            sleep 15
          done
          echo "swarm_status=$swarm_status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Sync evidence and update PR comments
        if: always() && steps.launch.outputs.run_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RELAY_WORKSPACE_KEY: ${{ secrets.RELAY_WORKSPACE_KEY }}
        run: review-gate/.github/workflows/scripts/swarm-post.sh "${{ steps.launch.outputs.run_id }}" "${{ github.event.pull_request.number }}" review-target

      - name: Enforce successful swarm
        if: steps.wait.outputs.swarm_status != 'completed'
        run: |
          echo "Review swarm ended with status: ${{ steps.wait.outputs.swarm_status }}" >&2
          exit 1
