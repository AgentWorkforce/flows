version: '1.0'
name: flows-drive
description: >
  The Relayflow Lead's tick. Runs on a schedule; each tick assesses repo
  state, executes the single highest-priority work package toward the current
  gate, verifies deterministically, gets adversarial review, opens a PR, and
  logs an honest report. Escalates to Khaliq only on needs_human. Charter:
  charter/LEAD.md. Constitution: docs/RFC-0001-everything-is-a-relayflow.md.

swarm:
  pattern: dag
  channel: flows-drive
  timeoutMs: 10800000

agents:
  - name: lead
    cli: claude
    preset: analyst
    role: The Relayflow Lead. Assesses state, plans one work package, reports honestly.
  - name: builder
    cli: codex
    preset: worker
    role: Implements the work package. Rust for kernel/, TypeScript for sdk/.
  - name: adversary
    cli: claude
    preset: reviewer
    role: Adversarial reviewer against RFC-0001 and AGENTS.md.

workflows:
  - name: drive-tick
    steps:
      - name: sync
        type: deterministic
        command: |
          # Materialize the repo; never assume it. This step assumed a clone
          # with an `origin` remote and so every cloud tick died here with
          # `fatal: 'origin' does not appear to be a git repository` (runs
          # 9fc8d996, ff35187a, 06505b94, 4cf36ea7, b33c2c9a).
          #
          # A cloud workflow sandbox does NOT get a clone. The platform's own
          # materialization is the code sync: the CLI tars the `git ls-files`
          # set and the bootstrap extracts it into the code mount, then runs
          # `git init` over it. Files yes, `.git` history and remotes no.
          # A checkout with a remote only exists on a host that already has one
          # (laptop, fleet node). Both shapes are supported below; neither is
          # assumed, and an unmaterialized sandbox fails closed and typed
          # rather than failing later as an unexplained tool error.
          set -eu
          echo "SYNC_WORKDIR=$(pwd)"

          missing=""
          for required in AGENTS.md docs/RFC-0001-everything-is-a-relayflow.md ops/DIRECTIVES.md kernel sdk; do
            [ -e "$required" ] || missing="$missing $required"
          done
          if [ -n "$missing" ]; then
            echo "SYNC_FAIL_NOT_MATERIALIZED: the repo is not present in this execution environment." >&2
            echo "  missing:$missing" >&2
            echo "  cwd: $(pwd)" >&2
            echo "  A cloud run must upload the working tree: \`agent-relay cloud run\`" >&2
            echo "  syncs code by default; \`--no-sync-code\` produces exactly this state." >&2
            exit 78
          fi
          echo "SYNC_MATERIALIZED=ok"

          # Fail fast on a stale tree. A per-step sandbox can be seeded from an
          # older orchestrator archive, and five consecutive runs burned ~20
          # minutes each producing diffs that reverted merged work — a stale
          # tree diffed against fresh main looks like a wholesale revert. The
          # guards at delivery caught them, but only after the cost was paid.
          #
          # ops/FORBIDDEN_PATHS lists paths that must NOT exist. Their presence
          # here means this sandbox is not the tree we uploaded, and nothing
          # built on it can be trusted.
          if [ -f ops/FORBIDDEN_PATHS ]; then
            stale=""
            while IFS= read -r forbidden; do
              case "$forbidden" in ''|\#*) continue ;; esac
              [ -e "$forbidden" ] && stale="$stale $forbidden"
            done < ops/FORBIDDEN_PATHS
            if [ -n "$stale" ]; then
              echo "SYNC_FAIL_STALE_TREE: this sandbox contains paths that do not exist on the base:" >&2
              for p in $stale; do echo "    $p" >&2; done
              echo "  The workspace was seeded from an older archive, so it is not the tree" >&2
              echo "  that was uploaded. A diff computed from it reverts merged work." >&2
              echo "  Failing now rather than spending a full cycle to produce an unusable diff." >&2
              exit 75
            fi
          fi

          git rev-parse --git-dir >/dev/null 2>&1 || git init -q
          git config user.email "lead@relayflows.local"
          git config user.name "Relayflow Lead"

          if git remote get-url origin >/dev/null 2>&1; then
            # Real checkout (laptop / fleet node): take the true origin/main.
            echo "SYNC_MODE=remote"
            git fetch --quiet origin
            git checkout --quiet -B main origin/main
            base=$(git rev-parse --short origin/main)
          else
            # Sandbox snapshot: there is no remote to fetch and nothing to
            # rebase onto. The snapshot IS the base. Commit it so the tick has
            # a parent to diff against — `git diff main` in the review step
            # needs a `main` that exists.
            echo "SYNC_MODE=snapshot"
            if ! git rev-parse --verify --quiet HEAD >/dev/null 2>&1; then
              git add -A
              git commit --quiet -m "snapshot base for this tick" || true
            fi
            git branch --quiet -f main HEAD 2>/dev/null || git checkout --quiet -b main
            base=$(git rev-parse --short HEAD)
          fi

          git checkout --quiet -B "flow/drive-${base}-$(date +%m%d%H%M)"
          echo "SYNC_BASE=$base"
          echo "SYNC_BRANCH=$(git rev-parse --abbrev-ref HEAD)"
          echo SYNCED

      - name: assess
        type: agent
        agent: lead
        dependsOn: [sync]
        task: |
          You are the Relayflow Lead (charter/LEAD.md). Assess the repo.

          YOUR SCOPE IS THE TASK YOU WERE GIVEN. Two launchers exist and they
          deliver it differently: ops/launch-gate.sh commits an ops/TARGET.md
          naming one gate, while the autodrive loop passes the task directly
          and writes NO TARGET.md. If ops/TARGET.md is absent that is normal —
          it is not missing context and there is nothing to go looking for.

          Either way: QUOTE the scope into ops/NEXT.md, never cite the path.
          TARGET.md lives only in the throwaway launch worktree and is NOT in
          the delivered diff, so a reviewer sees a reference to a file that
          does not exist. Review flagged that on PR #19 and again on #35, #40
          and #48 — it is now enforced in verify, which REFUSES a NEXT.md that
          cites a path not present in the tree. Anything you rely on must
          appear in the package itself.

          And when you state that something passes, paste the literal command
          and its output. "Three tests pass" with no captured output is not a
          claim a reviewer can check, and it was also flagged on PR #19. This
          is AGENTS.md's central standard, applied to your own reporting. It is the operator's scoping decision and it overrides your
          own judgement about priority — several runs execute in parallel, each
          pinned to a different gate, and a run that wanders outside its target
          will collide with a sibling. Stay inside it or, if the target is
          genuinely unreachable, say so in ops/NEEDS_HUMAN.md rather than
          silently choosing different work.
          Then read ops/STATE.md — it is ground truth about gates and open
          PRs for an environment with no git history, and it names the known
          sandbox faults that are NOT reasons to block. Then read
          ops/DIRECTIVES.md — standing human directives outrank the backlog;
          if one is unsatisfied, it IS the work package.
          Then read docs/bootstrap-report.md and ops/DRIVE-LOG.md if they exist,
          `git log --oneline -15`, `gh pr list --state open` and open PR review
          state, kernel/ and sdk/ test status. Then write ops/NEXT.md: the
          SINGLE highest-priority work package toward the current gate
          (gate 1 until its done-when in RFC-0001 §3 holds), with: objective,
          files in scope, definition of done (must include passing commands),
          and what is explicitly OUT of scope for this tick. If an open PR is
          awaiting fixes from review, the work package is fixing it — never
          start new work over unfinished work. If work is blocked on a human
          decision, write ops/NEEDS_HUMAN.md stating the exact question and the
          options — and then STILL end with ASSESS_DONE.

          COMMIT YOUR WORK PACKAGE BEFORE YOU FINISH:
            git add -A && git commit -m "assess: work package for this tick"
          Each step runs in its OWN sandbox and files reach the next step only
          through the executor's propagation, which is lossy: on runs a2089144
          and 2560e02d your predecessor wrote ops/NEXT.md, said so truthfully,
          and the file never arrived — one of those runs finished with a
          zero-file patch. Committing puts the package in git history rather
          than leaving it as a loose working-tree file. If the commit fails,
          say so in your output rather than finishing silently. The assess-gate step
          below reads that file and parks the run with a typed outcome.
          ALWAYS end with ASSESS_DONE, blocked or not: this gate cannot tell a
          different final token from a crashed agent, so on run 54ebd998 the
          Lead correctly reported BLOCKED_NEEDS_HUMAN three times and was
          scored as failing three times. Saying you are blocked is a result,
          not a failure — but it must be said in the file, not the token.
        verification:
          type: output_contains
          value: ASSESS_DONE
        timeoutMs: 1800000

      - name: assess-gate
        type: deterministic
        dependsOn: [assess]
        command: |
          # A typed park, not a crash. The assess step cannot express "blocked"
          # in its final token (its gate only recognises ASSESS_DONE), so the
          # Lead writes ops/NEEDS_HUMAN.md instead and this step reads it.
          set -u
          if [ -f ops/NEEDS_HUMAN.md ]; then
            echo "ASSESS_BLOCKED_NEEDS_HUMAN: the Lead escalated a decision it cannot make."
            echo "--- ops/NEEDS_HUMAN.md ---"
            cat ops/NEEDS_HUMAN.md
            exit 75
          fi
          if [ ! -f ops/NEXT.md ]; then
            echo "ASSESS_FAIL: no ops/NEXT.md — an assessment that named no work package did not assess"
            exit 1
          fi
          # The assessment must have WRITTEN this tick's package, not merely
          # left the previous one in place. On run 457a6102 assess reported
          # "The work package is written to ops/NEXT.md" and the very next step
          # read the OLD file — the logs carry the reason:
          #   "relayfile flush failed after the command succeeded (exit 1);
          #    a later agent step may see stale files"
          # The builder then correctly refused to invent scope, but only after
          # a whole build step had been spent. Catch it here instead: if
          # ops/NEXT.md is identical to the base, the assessment did not land,
          # whoever is at fault.
          # Look for the package in the working tree OR in a commit made this
          # tick. Propagation between per-step sandboxes is lossy, so a package
          # that exists only as a loose file may not arrive; one committed by
          # the assess step travels in git history instead.
          if git log --oneline main..HEAD -- ops/NEXT.md 2>/dev/null | grep -q .; then
            echo "ASSESS_PACKAGE_COMMITTED: found ops/NEXT.md change in this tick's history"
          elif git diff --quiet main -- ops/NEXT.md 2>/dev/null; then
            # Warn, do not fail. This was fatal, and it killed four runs in six
            # while the loop produced nothing — a worse outcome than the risk
            # it guarded against.
            #
            # The risk it guarded was "the builder gets scope nobody wrote this
            # tick". But scope does not actually come from ops/NEXT.md: it comes
            # from ops/TARGET.md, which the launcher COMMITS into the uploaded
            # tree, so it is present in every per-step sandbox and cannot be
            # lost to the propagation fault. NEXT.md refines the target; it does
            # not define it.
            echo "ASSESS_WARN_STALE_NEXT: ops/NEXT.md did not change from the base commit."
            echo "  The assess step's package did not survive the step boundary (a known"
            echo "  platform fault: per-step sandboxes lose both loose files and git objects)."
            echo "  Proceeding, because ops/TARGET.md is committed in the tree and carries this"
            echo "  run's scope. The builder is not working blind — it is working from the"
            echo "  target rather than from a refinement of it."
            if [ -f ops/TARGET.md ]; then
              echo "--- ops/TARGET.md (the scope that did survive) ---"
              head -8 ops/TARGET.md
            else
              echo "ASSESS_FAIL_NO_SCOPE: neither a fresh ops/NEXT.md nor an ops/TARGET.md."
              echo "  With no scope from either source the builder WOULD be working blind."
              exit 1
            fi
          fi
          # A package with no definition of done cannot be verified, and the
          # builder cannot honestly report BUILD_DONE against it.
          # A package must be verifiable, but do not dictate its wording. This
          # check demanded the literal phrase "definition of done" and so
          # rejected a CORRECT assessment three times on run 30475b25 — one
          # that reported gate 2's primitives already complete and proposed
          # moving to gate 3, and was right on both counts. A gate that
          # rejects true reports is as bad as one that accepts false ones.
          #
          # Accept either shape: a runnable command (that is what "verifiable"
          # actually means), or an explicit statement that this tick has no
          # buildable package.
          if grep -qiE "definition of done|definition-of-done|done when|done-when|acceptance criteria" ops/NEXT.md \
             || grep -qE "(cargo|npm|node|sh|pytest) [a-z]" ops/NEXT.md \
             || grep -qiE "no buildable work|nothing to build|assessment only|gate .* is (green|complete)" ops/NEXT.md; then
            :
          else
            echo "ASSESS_FAIL_NO_DOD: ops/NEXT.md names neither a runnable command nor a"
            echo "  statement that this tick has no buildable package. A work package that"
            echo "  cannot be verified cannot be built against."
            exit 1
          fi
          echo "ASSESS_GATE_PASS ($(grep -m1 -oE 'WP-[0-9]+[^|]*' ops/NEXT.md || echo 'work package'))"
        timeoutMs: 120000

      - name: build
        type: agent
        agent: builder
        dependsOn: [assess-gate]
        maxIterations: 3
        task: |
          Read ops/NEXT.md, AGENTS.md, and the relevant parts of
          docs/RFC-0001-everything-is-a-relayflow.md. Implement exactly that
          work package — nothing more. Run the definition-of-done commands
          yourself and iterate until they pass. Keep files small and
          single-purpose. End with BUILD_DONE only when the definition of done
          passes locally; paste the passing output.
        verification:
          type: output_contains
          value: BUILD_DONE
        timeoutMs: 5400000

      - name: verify
        type: deterministic
        dependsOn: [build]
        command: |
          # A gate that cannot fail is not a gate. Never pipe a test command
          # into tail inside the status check: the pipeline's status is tail's.
          set -u
          ran=0; ok=0

          # Bound every long-running command, not just the suites. Run
          # 6d045b23 sat in verify for 29+ minutes: its suites were bounded but
          # `cargo build` and `npm ci` were not, so a cold sandbox installing a
          # toolchain and compiling from scratch had no ceiling at all.
          # Bounding half the step is not bounding the step.
          #
          # timeoutMs is NOT enforced by the platform —
          # observed three times on 2026-08-28 (verify-1 at 31min against a
          # 20min bound, review-1 at 36min against 30min, plus an unbounded
          # toolchain install). And the kernel suite now contains a test that
          # intermittently hangs under sandbox timing:
          # an_entry_appended_during_watch_registration_is_delivered_exactly_once
          # ran past 60s in cloud while passing locally in 0.54s. Without a
          # bound here, one hanging test consumes the entire run budget.
          run_bounded() {
            _label="$1"; shift
            if command -v timeout >/dev/null 2>&1; then
              timeout "${VERIFY_SUITE_TIMEOUT:-900}" "$@"
            elif command -v gtimeout >/dev/null 2>&1; then
              gtimeout "${VERIFY_SUITE_TIMEOUT:-900}" "$@"
            else
              echo "VERIFY_WARN: no timeout(1); $_label runs unbounded" >&2
              "$@"
            fi
          }

          if [ -d kernel ]; then
            # Invoke through `sh`: in a cloud sandbox this script was present
            # but not executable (observed on run 4cf36ea7). Git tracks it as
            # mode 100755, so the exec bit is lost somewhere in materialization
            # — which stage is NOT established, so no mechanism is claimed here.
            # `sh <script>` does not depend on the bit either way.
            # Build BEFORE test: the SDK's live-kernel cases exec
            # kernel/target/debug/relayflowd, and `cargo test` does not
            # produce that binary. Without this the SDK suite fails 7 cases
            # in any environment that has not built the kernel by hand
            # (verified locally 2026-08-28: 143 passed/7 skipped/1 file
            # failed before `cargo build`, 150 passed after).
            out=$(cd kernel && run_bounded "kernel build" sh ../ops/cargo.sh build 2>&1); rc=$?
            if [ $rc -ne 0 ]; then
              echo "$out" | tail -12
              echo "VERIFY_FAIL: kernel build failed — the SDK cannot exercise a binary that does not exist"
              exit 1
            fi
            out=$(cd kernel && run_bounded "kernel suite" sh ../ops/cargo.sh test --workspace 2>&1); rc=$?
            echo "$out" | tail -8; ran=1
            if [ $rc -eq 124 ]; then
              echo "VERIFY_SUITE_TIMEOUT: the kernel suite exceeded ${VERIFY_SUITE_TIMEOUT:-900}s and was killed."
              echo "  A hanging test is a defect, not a pass — recording it as a failure."
            fi
            [ $rc -eq 0 ] || ok=1
          fi
          if [ -f sdk/package.json ]; then
            # node_modules is not in `git ls-files`, so a sandbox has none.
            # Install before testing, and treat a failed install as a failed
            # verify rather than letting `npm test` report a confusing error.
            if [ ! -d sdk/node_modules ]; then
              echo "VERIFY_INSTALL: sdk/node_modules absent — installing"
              out=$(cd sdk && run_bounded "npm ci" npm ci 2>&1); rc=$?
              if [ $rc -ne 0 ]; then
                echo "$out" | tail -12
                echo "VERIFY_FAIL: npm ci failed — cannot test what did not install"
                exit 1
              fi
            fi
            # Restore exec bits. `npm ci` reported success (96 packages) and
            # esbuild still failed with EACCES on run 909e18f6, so the mount
            # this installs onto does not carry the executable bit. That is
            # the same fault that left ops/cargo.sh non-executable. Which
            # layer drops it is NOT established; this repairs the symptom
            # where it is observed and is a no-op where the bit survives.
            chmod -R +x sdk/node_modules/.bin 2>/dev/null || true
            find sdk/node_modules -type d -name bin -path "*esbuild*" \
              -exec chmod -R +x {} + 2>/dev/null || true
            out=$(cd sdk && run_bounded "sdk suite" npm test 2>&1); rc=$?
            echo "$out" | tail -8; ran=1
            if [ $rc -eq 124 ]; then
              echo "VERIFY_SUITE_TIMEOUT: the sdk suite exceeded ${VERIFY_SUITE_TIMEOUT:-900}s and was killed."
            fi
            [ $rc -eq 0 ] || ok=1
          fi
          if [ "$ran" -eq 0 ]; then
            echo "VERIFY_FAIL: no suite found — a verify that runs nothing cannot pass"; exit 1
          fi
          # Enforce the NEXT.md contract instead of asking for it.
          #
          # The assess prompt has told runs since PR #19 to quote their scope
          # rather than cite ops/TARGET.md, because that file lives only in the
          # throwaway launch worktree and is not in the delivered diff. Runs
          # kept citing it anyway — reviewers filed the same finding again on
          # #35, #40 and #48. Four recurrences after the warning is enough
          # evidence that prose does not hold and a check does.
          #
          # Same for unevidenced test claims: "all three tests pass" with no
          # transcript. validateNextWorkPackage refuses both shapes.
          #
          # Runs BEFORE the node_modules cleanup below, which needs sdk/dist.
          if [ -f ops/NEXT.md ] && [ -f sdk/dist/index.js ]; then
            nextout=$(node -e '
              const fs = require("node:fs");
              const { validateNextWorkPackage } = require("./sdk/dist/index.js");
              const verdict = validateNextWorkPackage(
                fs.readFileSync("ops/NEXT.md", "utf8"),
                (p) => fs.existsSync(p),
              );
              if (!verdict.accepted) {
                console.log("NEXT_REFUSED " + verdict.reason);
                process.exit(1);
              }
              console.log("NEXT_OK");
            ' 2>&1) || true
            echo "$nextout" | tail -2
            case "$nextout" in
              *NEXT_REFUSED*)
                echo "VERIFY_FAIL: ops/NEXT.md was refused — quote your scope instead of citing"
                echo "  ops/TARGET.md (it is not in the delivered diff), and paste the literal"
                echo "  command output for anything you claim passes."
                ok=1
                ;;
            esac
          fi

          # Shrink the tree before the flush that matters.
          #
          # The relayfile mount flush fails on a large tree — http 413, or a
          # timeout waiting for the daemon to ack — and the failure is
          # NON-FATAL, so the run reports success while later steps read stale
          # files and the delivered patch silently loses the work. Five runs
          # were lost this way. PR #38 took kernel/target out (4914 paths ->
          # 0), which was not enough on its own: run 5ecf7078 still flushed
          # 1932 files and still hit 413.
          #
          # sdk/node_modules is what remains — 1226 files, 52 MB, and already
          # gitignored, so nothing downstream of here reads it: the suites have
          # finished by this line, and commit/handoff touch only tracked files.
          # Removing it after the gates pass costs nothing and takes the bulk
          # of the payload out of every flush from here on.
          #
          # Runs on pass AND fail. The first version only slimmed on a green
          # verify, to keep a failing run's tree intact for diagnosis. That
          # defeated the fix: run ae982aaa ended VERIFY_FAIL_NONFATAL, so the
          # cleanup was skipped, the tree stayed at 1842 files and the flush
          # failed with three 413s — and the run still committed and delivered
          # a PR. A run that delivers needs its flush to work whether or not
          # its gates passed, and node_modules is reinstallable, so there was
          # never anything to preserve for diagnosis here.
          #
          # Guarded with || true and placed AFTER the pass/fail decision is
          # computed, so a cleanup problem can never change the verdict.
          rm -rf sdk/node_modules 2>/dev/null || true
          echo "VERIFY_TREE_SLIMMED: removed sdk/node_modules before flush (ok=$ok)"

          # Measure the tree instead of guessing at it.
          #
          # The relayfile flush keeps failing (http 413) and three successive
          # hypotheses about WHY were wrong: kernel/target was removed and the
          # count barely moved; node_modules was removed and it still failed;
          # HOME turned out to be /home/daytona, outside the tree, so the
          # toolchain was never in it. Meanwhile the bootstrap reports ~1900
          # changed files against a repo of only 257 tracked ones, and the
          # delivered patch is 12 files. Nothing in the log says what the rest
          # are, so this prints it rather than inviting a fourth guess.
          echo "TREE_CENSUS: top directories by file count"
          find . -type f -not -path './.git/*' 2>/dev/null \
            | sed -E 's|^\./||; s|/[^/]*$||' \
            | cut -d/ -f1-2 \
            | sort | uniq -c | sort -rn | head -12 || true
          echo "TREE_CENSUS_TOTAL: $(find . -type f -not -path './.git/*' 2>/dev/null | wc -l | tr -d ' ')"
          [ "$ok" -eq 0 ] && echo VERIFY_PASS || { echo VERIFY_FAIL; exit 1; }
        timeoutMs: 1200000

      - name: review
        type: agent
        agent: adversary
        dependsOn: [verify]
        task: |
          Review `git diff main` against ops/NEXT.md (scope), AGENTS.md
          (standards) and RFC-0001 (semantics). Try to refute. List violations
          with file:line. FIRST write your complete review (findings, evidence,
          verdict rationale) to ops/reviews/$(date +%Y%m%d-%H%M)-review.md and
          `git add` it — an unpersisted verdict is not evidence.

          Classify EVERY finding as exactly one of:

            BLOCKING — the shipped behavior is wrong, unsafe, or out of scope;
              a test or gate cannot fail; OR a claim about verification is
              false (a report says something was run, passed, or was proven
              when it was not). A false verification claim is ALWAYS blocking,
              because the whole program's trust rests on those claims being
              literal. This is the careful edge: do not soften it.

            ADVISORY — the work is right but the account of it is imprecise:
              a citation points at the wrong line, a mechanism is described
              backwards, prose overstates or misnames something. Real defects,
              recorded and carried, but they do not block a merge.

          Ten consecutive ticks were rejected on ADVISORY-class findings while
          their behavior was sound. Wrong prose about right code is a defect to
          fix, not a reason to discard the work.

          End with REVIEW_FAILED if any finding is BLOCKING. Otherwise end with
          REVIEW_PASSED, and list the advisory findings under a heading
          `## Advisory (carried, non-blocking)` so they are picked up rather
          than lost.
        verification:
          # Accept EITHER verdict: an honest REVIEW_FAILED must be
          # distinguishable from a crashed reviewer. The verdict step below
          # decides the run's fate; this gate only proves the reviewer spoke.
          type: output_contains
          value: "REVIEW_"
        maxIterations: 1
        timeoutMs: 1800000

      - name: verdict
        type: deterministic
        dependsOn: [review]
        command: |
          # Typed outcome, not a token: a truthful REVIEW_FAILED stops the run
          # cleanly (no PR, no retry loop); a crash never reaches here because
          # the review gate requires the reviewer to have spoken at all.
          set -u
          # Only review transcripts carry verdicts. ops/reviews/ also holds
          # audits and fix summaries; picking the newest *.md read an audit as
          # a missing verdict on its first outing after a merge.
          # Sort by FILENAME, not mtime: a fresh git checkout stamps every
          # file with the checkout time, so `ls -t` picked an arbitrary old
          # transcript (read 20260827-2045 during a 20260828 tick). Names are
          # YYYYMMDD-HHMM-*, so lexical order IS chronological order.
          latest=$(ls ops/reviews/*-review.md 2>/dev/null | sort | tail -1)
          if [ -z "$latest" ]; then
            echo "VERDICT_UNKNOWN: no persisted review transcript — an unpersisted verdict is not evidence"; exit 1
          fi
          # The verdict is the LAST verdict token in the transcript, not any
          # mention of one: a passing review that discusses a previous
          # REVIEW_FAILED must not be read as a rejection. (It was, on the
          # first outing of this gate.)
          v=$(grep -oE "REVIEW_(PASSED|FAILED)" "$latest" | tail -1)
          case "$v" in
            REVIEW_FAILED) echo "VERDICT_FAILED: reviewer rejected this diff — see $latest"; exit 1 ;;
            REVIEW_PASSED) echo "VERDICT_PASS ($latest)"; exit 0 ;;
            *) echo "VERDICT_UNKNOWN: $latest carries no verdict"; exit 1 ;;
          esac
        timeoutMs: 120000

      - name: pr
        type: deterministic
        dependsOn: [verdict]
        command: |
          # Delivery is the one thing a tick cannot fake. `git push` needs a
          # remote and `gh pr create` needs an authenticated gh; a cloud
          # workflow sandbox has neither (it gets no GitHub token — see
          # ops/reviews/*-cloud-execution.md). Rather than dying on an opaque
          # `fatal: 'origin' does not appear...` after five expensive steps,
          # each precondition is named before it is used, and an environment
          # that cannot deliver says so in one typed line.
          set -eu
          title=$(grep -m1 -oE "WP-[0-9]+[^|]*" ops/NEXT.md | sed "s/[[:space:]]*$//" || echo "work package")
          git add -A
          git commit -m "drive: $title" || echo "PR_NOTE: nothing new to commit"

          # Two delivery paths, because the two environments differ in kind.
          # A checkout with a remote and an authenticated gh pushes and opens a
          # PR directly. A cloud sandbox has NEITHER — by design, since cloud
          # keeps raw GitHub tokens out of workflow sandboxes — so it delivers
          # through the server-side proxy instead, which takes file contents.
          if ! git remote get-url origin >/dev/null 2>&1; then
            if [ -n "${CLOUD_API_URL:-}" ] && [ -n "${RELAYFILE_TOKEN:-}" ]; then
              echo "PR_MODE=proxy (no git remote; delivering via the cloud PR endpoint)"
              node ops/open-pr.mjs
              exit $?
            fi
            echo "PR_BLOCKED_NO_REMOTE: this environment has no git remote and no" >&2
            echo "  CLOUD_API_URL/RELAYFILE_TOKEN to deliver through, so the tick's" >&2
            echo "  work cannot leave here. The diff is committed on" >&2
            echo "  $(git rev-parse --abbrev-ref HEAD) inside the sandbox only." >&2
            echo "  Recover it with: agent-relay cloud sync \$RUN_ID" >&2
            exit 75
          fi
          echo "PR_MODE=git (remote present)"
          if ! gh auth status >/dev/null 2>&1; then
            echo "PR_BLOCKED_NO_GH_AUTH: a remote exists but gh is not authenticated," >&2
            echo "  so the branch can be pushed but no PR can be opened." >&2
            exit 75
          fi

          git push -u origin HEAD
          gh pr create --fill --body "Automated drive tick. Work package: see ops/NEXT.md in diff. Verification and adversarial review passed in-run. A human merges." 2>&1 | tail -2
          echo PR_OPENED

      - name: log
        type: agent
        agent: lead
        dependsOn: [pr]
        task: |
          Append one dated entry to ops/DRIVE-LOG.md: work package, verify
          output summary (verbatim tail), review verdict, PR link, honest state
          of the current gate, and the likely next package. Commit and push to
          the current branch. End with TICK_LOGGED.
        verification:
          type: output_contains
          value: TICK_LOGGED
        timeoutMs: 900000
