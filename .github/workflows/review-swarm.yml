name: Review swarm

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: review-swarm-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    # Ordering invariant: job 75 min > poll 65 min > swarm 60 min.
    timeout-minutes: 75
    steps:
      # The immutable judge comes from main, never from the reviewed revision.
      - name: Checkout trusted gate
        uses: actions/checkout@v4
        with:
          ref: main
          path: gate
          sparse-checkout: |
            workflows/review-swarm.yaml
            .github/workflows/scripts/swarm-post.sh

      - name: Checkout reviewed PR
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: target
          fetch-depth: 0

      - name: Validate cloud authentication
        env:
          RELAY_WORKSPACE_KEY: ${{ secrets.RELAY_WORKSPACE_KEY }}
        run: |
          if [ -z "$RELAY_WORKSPACE_KEY" ]; then
            echo "RELAY_WORKSPACE_KEY secret not configured; see README §Cloud review swarm"
            exit 1
          fi

      - name: Install Agent Relay
        run: npm install --global agent-relay

      - name: Prepare immutable gate and review target
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: gate/.github/workflows/scripts/swarm-prepare.sh gate target

      - name: Launch review swarm
        id: launch
        working-directory: target
        env:
          RELAY_WORKSPACE_KEY: ${{ secrets.RELAY_WORKSPACE_KEY }}
        run: |
          response=$(agent-relay cloud run .review-gate/review-swarm.yaml --sync-code --json)
          run_id=$(jq -er '.runId // .id' <<<"$response")
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "Launched review swarm $run_id"

      - name: Wait for review swarm
        id: wait
        if: steps.launch.outputs.run_id != ''
        env:
          RELAY_WORKSPACE_KEY: ${{ secrets.RELAY_WORKSPACE_KEY }}
          RUN_ID: ${{ steps.launch.outputs.run_id }}
        run: |
          # Ordering invariant: poll 3900s (65 min) > swarm 3600s (60 min).
          deadline=$((SECONDS + 3900))
          swarm_status=timed_out
          while (( SECONDS < deadline )); do
            response=$(agent-relay cloud status "$RUN_ID" --json) || true
            status=$(jq -r '.status // empty' <<<"$response" 2>/dev/null || true)
            case "$status" in
              completed|failed|cancelled)
                swarm_status=$status
                break
                ;;
            esac
            sleep 15
          done
          echo "swarm_status=$swarm_status" >> "$GITHUB_OUTPUT"
          echo "Review swarm terminal status: $swarm_status"
          exit 0

      - name: Post review evidence
        if: always() && steps.launch.outputs.run_id != ''
        working-directory: target
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RUN_ID: ${{ steps.launch.outputs.run_id }}
          SWARM_STATUS: ${{ steps.wait.outputs.swarm_status }}
          RELAY_WORKSPACE_KEY: ${{ secrets.RELAY_WORKSPACE_KEY }}
        run: ../gate/.github/workflows/scripts/swarm-post.sh

      - name: Enforce completed cloud run
        if: steps.wait.outputs.swarm_status != 'completed'
        run: |
          echo "Review swarm did not complete: ${{ steps.wait.outputs.swarm_status }}"
          exit 1
