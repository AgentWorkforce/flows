version: '1.0'
name: flows-drive
description: >
  The Relayflow Lead's tick. Runs on a schedule; each tick assesses repo
  state, executes the single highest-priority work package toward the current
  gate, verifies deterministically, gets adversarial review, opens a PR, and
  logs an honest report. Escalates to Khaliq only on needs_human. Charter:
  charter/LEAD.md. Constitution: docs/RFC-0001-everything-is-a-relayflow.md.

swarm:
  pattern: dag
  channel: flows-drive
  timeoutMs: 10800000

agents:
  - name: lead
    cli: claude
    preset: analyst
    role: The Relayflow Lead. Assesses state, plans one work package, reports honestly.
  - name: builder
    cli: codex
    preset: worker
    role: Implements the work package. Rust for kernel/, TypeScript for sdk/.
  - name: adversary
    cli: claude
    preset: reviewer
    role: Adversarial reviewer against RFC-0001 and AGENTS.md.

workflows:
  - name: drive-tick
    steps:
      - name: sync
        type: deterministic
        command: |
          # Materialize the repo; never assume it. This step assumed a clone
          # with an `origin` remote and so every cloud tick died here with
          # `fatal: 'origin' does not appear to be a git repository` (runs
          # 9fc8d996, ff35187a, 06505b94, 4cf36ea7, b33c2c9a).
          #
          # A cloud workflow sandbox does NOT get a clone. The platform's own
          # materialization is the code sync: the CLI tars the `git ls-files`
          # set and the bootstrap extracts it into the code mount, then runs
          # `git init` over it. Files yes, `.git` history and remotes no.
          # A checkout with a remote only exists on a host that already has one
          # (laptop, fleet node). Both shapes are supported below; neither is
          # assumed, and an unmaterialized sandbox fails closed and typed
          # rather than failing later as an unexplained tool error.
          set -eu
          echo "SYNC_WORKDIR=$(pwd)"

          missing=""
          for required in AGENTS.md docs/RFC-0001-everything-is-a-relayflow.md ops/DIRECTIVES.md kernel sdk; do
            [ -e "$required" ] || missing="$missing $required"
          done
          if [ -n "$missing" ]; then
            echo "SYNC_FAIL_NOT_MATERIALIZED: the repo is not present in this execution environment." >&2
            echo "  missing:$missing" >&2
            echo "  cwd: $(pwd)" >&2
            echo "  A cloud run must upload the working tree: \`agent-relay cloud run\`" >&2
            echo "  syncs code by default; \`--no-sync-code\` produces exactly this state." >&2
            exit 78
          fi
          echo "SYNC_MATERIALIZED=ok"

          git rev-parse --git-dir >/dev/null 2>&1 || git init -q
          git config user.email "lead@relayflows.local"
          git config user.name "Relayflow Lead"

          if git remote get-url origin >/dev/null 2>&1; then
            # Real checkout (laptop / fleet node): take the true origin/main.
            echo "SYNC_MODE=remote"
            git fetch --quiet origin
            git checkout --quiet -B main origin/main
            base=$(git rev-parse --short origin/main)
          else
            # Sandbox snapshot: there is no remote to fetch and nothing to
            # rebase onto. The snapshot IS the base. Commit it so the tick has
            # a parent to diff against — `git diff main` in the review step
            # needs a `main` that exists.
            echo "SYNC_MODE=snapshot"
            if ! git rev-parse --verify --quiet HEAD >/dev/null 2>&1; then
              git add -A
              git commit --quiet -m "snapshot base for this tick" || true
            fi
            git branch --quiet -f main HEAD 2>/dev/null || git checkout --quiet -b main
            base=$(git rev-parse --short HEAD)
          fi

          git checkout --quiet -B "flow/drive-${base}-$(date +%m%d%H%M)"
          echo "SYNC_BASE=$base"
          echo "SYNC_BRANCH=$(git rev-parse --abbrev-ref HEAD)"
          echo SYNCED

      - name: assess
        type: agent
        agent: lead
        dependsOn: [sync]
        task: |
          You are the Relayflow Lead (charter/LEAD.md). Assess the repo:
          FIRST read ops/DIRECTIVES.md — standing human directives outrank
          the backlog; if one is unsatisfied, it IS the work package.
          Then read docs/bootstrap-report.md and ops/DRIVE-LOG.md if they exist,
          `git log --oneline -15`, `gh pr list --state open` and open PR review
          state, kernel/ and sdk/ test status. Then write ops/NEXT.md: the
          SINGLE highest-priority work package toward the current gate
          (gate 1 until its done-when in RFC-0001 §3 holds), with: objective,
          files in scope, definition of done (must include passing commands),
          and what is explicitly OUT of scope for this tick. If an open PR is
          awaiting fixes from review, the work package is fixing it — never
          start new work over unfinished work. If work is blocked on a human
          decision, write ops/NEEDS_HUMAN.md stating the exact question and end
          with BLOCKED_NEEDS_HUMAN; otherwise end with ASSESS_DONE.
        verification:
          type: output_contains
          value: ASSESS_DONE
        timeoutMs: 1800000

      - name: build
        type: agent
        agent: builder
        dependsOn: [assess]
        maxIterations: 3
        task: |
          Read ops/NEXT.md, AGENTS.md, and the relevant parts of
          docs/RFC-0001-everything-is-a-relayflow.md. Implement exactly that
          work package — nothing more. Run the definition-of-done commands
          yourself and iterate until they pass. Keep files small and
          single-purpose. End with BUILD_DONE only when the definition of done
          passes locally; paste the passing output.
        verification:
          type: output_contains
          value: BUILD_DONE
        timeoutMs: 5400000

      - name: verify
        type: deterministic
        dependsOn: [build]
        command: |
          # A gate that cannot fail is not a gate. Never pipe a test command
          # into tail inside the status check: the pipeline's status is tail's.
          set -u
          ran=0; ok=0
          if [ -d kernel ]; then
            out=$(cd kernel && ../ops/cargo.sh test --workspace 2>&1); rc=$?
            echo "$out" | tail -8; ran=1; [ $rc -eq 0 ] || ok=1
          fi
          if [ -f sdk/package.json ]; then
            out=$(cd sdk && npm test 2>&1); rc=$?
            echo "$out" | tail -8; ran=1; [ $rc -eq 0 ] || ok=1
          fi
          if [ "$ran" -eq 0 ]; then
            echo "VERIFY_FAIL: no suite found — a verify that runs nothing cannot pass"; exit 1
          fi
          [ "$ok" -eq 0 ] && echo VERIFY_PASS || { echo VERIFY_FAIL; exit 1; }
        timeoutMs: 1200000

      - name: review
        type: agent
        agent: adversary
        dependsOn: [verify]
        task: |
          Review `git diff main` against ops/NEXT.md (scope), AGENTS.md
          (standards) and RFC-0001 (semantics). Try to refute. List violations
          with file:line. FIRST write your complete review (findings, evidence,
          verdict rationale) to ops/reviews/$(date +%Y%m%d-%H%M)-review.md and
          `git add` it — an unpersisted verdict is not evidence. Then end with
          REVIEW_PASSED only if the diff honestly meets the bar and stays in
          scope; otherwise REVIEW_FAILED.
        verification:
          # Accept EITHER verdict: an honest REVIEW_FAILED must be
          # distinguishable from a crashed reviewer. The verdict step below
          # decides the run's fate; this gate only proves the reviewer spoke.
          type: output_contains
          value: "REVIEW_"
        maxIterations: 1
        timeoutMs: 1800000

      - name: verdict
        type: deterministic
        dependsOn: [review]
        command: |
          # Typed outcome, not a token: a truthful REVIEW_FAILED stops the run
          # cleanly (no PR, no retry loop); a crash never reaches here because
          # the review gate requires the reviewer to have spoken at all.
          set -u
          latest=$(ls -t ops/reviews/*.md 2>/dev/null | head -1)
          if [ -z "$latest" ]; then
            echo "VERDICT_UNKNOWN: no persisted review transcript — an unpersisted verdict is not evidence"; exit 1
          fi
          # The verdict is the LAST verdict token in the transcript, not any
          # mention of one: a passing review that discusses a previous
          # REVIEW_FAILED must not be read as a rejection. (It was, on the
          # first outing of this gate.)
          v=$(grep -oE "REVIEW_(PASSED|FAILED)" "$latest" | tail -1)
          case "$v" in
            REVIEW_FAILED) echo "VERDICT_FAILED: reviewer rejected this diff — see $latest"; exit 1 ;;
            REVIEW_PASSED) echo "VERDICT_PASS ($latest)"; exit 0 ;;
            *) echo "VERDICT_UNKNOWN: $latest carries no verdict"; exit 1 ;;
          esac
        timeoutMs: 120000

      - name: pr
        type: deterministic
        dependsOn: [verdict]
        command: |
          # Delivery is the one thing a tick cannot fake. `git push` needs a
          # remote and `gh pr create` needs an authenticated gh; a cloud
          # workflow sandbox has neither (it gets no GitHub token — see
          # ops/reviews/*-cloud-execution.md). Rather than dying on an opaque
          # `fatal: 'origin' does not appear...` after five expensive steps,
          # each precondition is named before it is used, and an environment
          # that cannot deliver says so in one typed line.
          set -eu
          title=$(grep -m1 -oE "WP-[0-9]+[^|]*" ops/NEXT.md | sed "s/[[:space:]]*$//" || echo "work package")
          git add -A
          git commit -m "drive: $title" || echo "PR_NOTE: nothing new to commit"

          if ! git remote get-url origin >/dev/null 2>&1; then
            echo "PR_BLOCKED_NO_REMOTE: this environment has no git remote, so the tick's" >&2
            echo "  work cannot be delivered from here. The diff is committed on" >&2
            echo "  $(git rev-parse --abbrev-ref HEAD) inside the sandbox only." >&2
            echo "  Recover it with: agent-relay cloud sync \$RUN_ID" >&2
            exit 75
          fi
          if ! gh auth status >/dev/null 2>&1; then
            echo "PR_BLOCKED_NO_GH_AUTH: a remote exists but gh is not authenticated," >&2
            echo "  so the branch can be pushed but no PR can be opened." >&2
            exit 75
          fi

          git push -u origin HEAD
          gh pr create --fill --body "Automated drive tick. Work package: see ops/NEXT.md in diff. Verification and adversarial review passed in-run. A human merges." 2>&1 | tail -2
          echo PR_OPENED

      - name: log
        type: agent
        agent: lead
        dependsOn: [pr]
        task: |
          Append one dated entry to ops/DRIVE-LOG.md: work package, verify
          output summary (verbatim tail), review verdict, PR link, honest state
          of the current gate, and the likely next package. Commit and push to
          the current branch. End with TICK_LOGGED.
        verification:
          type: output_contains
          value: TICK_LOGGED
        timeoutMs: 900000
