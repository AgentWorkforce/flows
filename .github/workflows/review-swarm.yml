name: Review swarm

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: review-swarm-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    # Ordering invariant: job 75 min > poll 3900 s > swarm 3600000 ms.
    timeout-minutes: 75
    steps:
      - name: Checkout immutable gate from main
        uses: actions/checkout@v4
        with:
          ref: main
          path: gate

      - name: Checkout pull request head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: pr-head

      - name: Validate cloud authentication
        env:
          RELAY_WORKSPACE_KEY: ${{ secrets.RELAY_WORKSPACE_KEY }}
        run: |
          if [ -z "$RELAY_WORKSPACE_KEY" ]; then
            echo "RELAY_WORKSPACE_KEY secret not configured; see README §Cloud review swarm"
            exit 1
          fi

      - name: Install Agent Relay
        run: npm install --global agent-relay

      - name: Prepare review target on runner
        env:
          GH_TOKEN: ${{ github.token }}
        run: gate/.github/workflows/scripts/swarm-prepare.sh gate "${{ github.event.pull_request.number }}"

      - name: Launch immutable cloud gate
        id: launch
        working-directory: gate
        env:
          RELAY_WORKSPACE_KEY: ${{ secrets.RELAY_WORKSPACE_KEY }}
        run: |
          response=$(agent-relay cloud run workflows/review-swarm.yaml --sync-code --json)
          run_id=$(printf '%s' "$response" | jq -er '.runId // .run_id // .id')
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"

      - name: Wait for terminal status
        id: wait
        if: steps.launch.outputs.run_id != ''
        env:
          RELAY_WORKSPACE_KEY: ${{ secrets.RELAY_WORKSPACE_KEY }}
        run: |
          # Ordering invariant: job 75 min > poll 3900 s > swarm 3600000 ms.
          deadline=$((SECONDS + 3900))
          swarm_status=timed_out
          while [ "$SECONDS" -lt "$deadline" ]; do
            response=$(agent-relay cloud status "${{ steps.launch.outputs.run_id }}" --json) || {
              swarm_status=status_error
              break
            }
            swarm_status=$(printf '%s' "$response" | jq -r '.status // "unknown"')
            case "$swarm_status" in
              completed|failed|cancelled|canceled|aborted) break ;;
            esac
            sleep 15
          done
          echo "swarm_status=$swarm_status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Sync transcripts and update sticky comments
        id: post
        if: always() && steps.launch.outputs.run_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RELAY_WORKSPACE_KEY: ${{ secrets.RELAY_WORKSPACE_KEY }}
        run: |
          gate/.github/workflows/scripts/swarm-post.sh gate \
            "${{ github.event.pull_request.number }}" \
            "${{ steps.launch.outputs.run_id }}"

      - name: Enforce swarm result
        if: always() && (steps.wait.outputs.swarm_status != 'completed' || steps.post.outcome != 'success')
        run: |
          echo "review swarm did not complete with three passing, posted transcripts"
          exit 1
