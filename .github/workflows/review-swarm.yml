name: Review swarm

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: review-swarm-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: >-
      github.event.pull_request.user.login == 'kjgbot' ||
      github.event.pull_request.user.login == 'miyaontherelay'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      GH_TOKEN: ${{ github.token }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      RELAY_WORKSPACE_KEY: ${{ secrets.RELAY_WORKSPACE_KEY }}
    steps:
      - name: Check out pull request merge commit
        uses: actions/checkout@v4
        with:
          ref: refs/pull/${{ github.event.pull_request.number }}/merge
          fetch-depth: 0

      - name: Install agent-relay
        run: npm install --global agent-relay@11.8.2

      - name: Set review target
        run: echo "$PR_NUMBER" > .review-target

      - name: Launch review swarm
        id: launch
        shell: bash
        run: |
          set -euo pipefail
          response=$(agent-relay cloud run workflows/review-swarm.yaml --json)
          run_id=$(jq -er '.runId // .id // .run.id' <<<"$response")
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "Launched review-swarm run $run_id"

      - name: Wait for review swarm
        shell: bash
        env:
          RUN_ID: ${{ steps.launch.outputs.run_id }}
        run: |
          set -euo pipefail
          deadline=$((SECONDS + 2700))
          while (( SECONDS < deadline )); do
            response=$(agent-relay cloud status "$RUN_ID" --json)
            status=$(jq -er '.status // .run.status' <<<"$response")
            echo "Review-swarm status: $status"
            if [[ "$status" == "completed" ]]; then
              exit 0
            fi
            sleep 30
          done
          echo "Review-swarm run $RUN_ID did not complete within 45 minutes" >&2
          exit 1

      - name: Sync review artifacts
        env:
          RUN_ID: ${{ steps.launch.outputs.run_id }}
        run: agent-relay cloud sync "$RUN_ID"

      - name: Post review comments
        env:
          RUN_ID: ${{ steps.launch.outputs.run_id }}
        run: bash .github/workflows/scripts/swarm-post.sh "$RUN_ID" "$PR_NUMBER"
