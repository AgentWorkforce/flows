# A local drive tick: pick the next backlog item, do it, verify it, report.
#
# This replaces a flow that could only ever execute BACKLOG F8b. That version
# proved a relayflow can drive a real change on this checkout with no Cloud
# admission, no Daytona and no Relaycast workspace — but its selector hardcoded
# one file and one identifier, so every subsequent tick needed a human to edit
# the script before the loop could run again. A loop that needs editing between
# iterations is not a loop.
#
# Two changes make it general. Selection comes from the SDK's backlog picker
# (gate 3), the same rule the cloud drive uses, so the two cannot drift about
# what "next" means. And implementation is an agent step rather than a
# deterministic rewrite, because a deterministic step can only make mechanical
# changes and most backlog entries are not mechanical.
#
# Run: node scripts/run-local-workflow.mjs workflows/drive-local.yaml
# Delivery stays with the operator: this flow never commits, never switches
# branches and never merges. It leaves a working tree and a report.
version: '0.1.0'
name: drive-local
description: >-
  Select the next work package from ops/BACKLOG.md, implement it, verify it
  against its own definition of done, and report. Selection, implementation,
  verification and reporting are journaled as four steps.
steps:
  # No build-sdk step. The launcher asserts `packages/sdk/dist/cli.js` exists
  # during preflight, before it submits anything, so a build step inside the
  # flow can never run on the cold checkout it was meant to serve. Building the
  # SDK is a prerequisite of invoking this flow, not part of it:
  #     npm --prefix packages/sdk run build
  - id: select
    type: deterministic
    timeoutMs: 120000
    command: node ops/local-work-package.mjs select

  - id: implement
    type: agent
    cli: claude
    dependsOn: [select]
    # Required, not decorative: the launcher refuses an agent step with no pins
    # (`LOCAL_AGENT_PINS_REQUIRED: declare a stream; the kernel refuses workers
    # with no pins`) and the run is never created. Verified by running it.
    surfaces:
      streams:
        - stream: drive-local
    # No timeoutMs: 0.1.0 bounds deterministic steps only, so an agent step
    # cannot declare one. The run-level bound is the operator's.
    maxIterations: 1
    instruction: |
      Read .relayflow/drive-local/package.json. It holds one work package
      selected from ops/BACKLOG.md: a title, the files in scope, and a
      definition of done.

      Implement exactly that package on this checkout. Stay inside the files it
      names; if the work genuinely requires a file outside that list, say so in
      your output rather than widening scope silently.

      Do not commit, do not switch branches, do not merge. The operator delivers
      the diff.

      End your final message with the single uppercase word DONE on its own
      line. The verification below gates on that exact marker, so a correct
      implementation that omits it is recorded as a failure.

      If the package cannot be implemented as written — it is already done, its
      premise is false, or it is underspecified — say that plainly and change
      nothing. A tick that reports "already done" is a good tick; a tick that
      invents an edit to look busy is not.
    verification:
      type: output_contains
      value: "DONE"

  - id: verify
    type: deterministic
    dependsOn: [implement]
    timeoutMs: 900000
    # The suites, not the agent's own account of itself.
    command: |
      set -eu
      cd packages/sdk
      node node_modules/vitest/vitest.mjs run

  - id: report
    type: deterministic
    dependsOn: [verify]
    timeoutMs: 120000
    command: node ops/local-work-package.mjs report
