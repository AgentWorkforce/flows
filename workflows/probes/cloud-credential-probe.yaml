version: '1.0'
name: cloud-credential-probe
description: >
  Proves whether a cloud workflow sandbox can authenticate an agent CLI.
  Deliberately touches no repo: one agent step, no git, so a failure here is
  about credentials and nothing else. Companion to cloud-repo-probe.yaml.
swarm:
  pattern: pipeline
  channel: cloud-probe
  timeoutMs: 600000
agents:
  - name: prober
    cli: codex
    preset: worker
    role: Emits one line to prove the CLI authenticated in this sandbox.
workflows:
  - name: probe
    steps:
      - name: env
        type: deterministic
        command: |
          echo "host: $(hostname)"; echo "pwd: $(pwd)"
          echo "codex: $(command -v codex || echo MISSING)"
          echo "claude: $(command -v claude || echo MISSING)"
          echo ENV_PROBED
      - name: think
        type: agent
        agent: prober
        dependsOn: [env]
        task: |
          Reply with exactly these two lines and nothing else:
          CLOUD_CLI_AUTHENTICATED
          DONE
        verification:
          type: output_contains
          value: CLOUD_CLI_AUTHENTICATED
        timeoutMs: 300000
