[workspace]
members = ["relayflowd-core", "relayflowd-journal", "relayflowd"]
resolver = "2"

[workspace.package]
edition = "2024"
license = "MIT"
version = "0.1.0"

[workspace.dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
jsonschema = { version = "0.33", default-features = false }
libc = "0.2"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tempfile = "3.20"
thiserror = "2.0"
ulid = { version = "1.2", features = ["serde"] }
ureq = "2.12"
wait-timeout = "0.2"
