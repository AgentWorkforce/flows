  - name: verify-1
    type: deterministic
    dependsOn:
    - build-1
    command: "# CLOUD VARIANT (generated): a FAILED verify is recorded and the\n# run continues. Nothing\
      \ is delivered from a sandbox, so a failure\n# here cannot ship; the next cycle's assess treats\
      \ it as the work\n# package. On a delivering environment verify stays fatal.\n# A gate that cannot\
      \ fail is not a gate. Never pipe a test command\n# into tail inside the status check: the pipeline's\
      \ status is tail's.\nset -u\nran=0; ok=0\n\n# Bound every long-running command, not just the suites.\
      \ Run\n# 6d045b23 sat in verify for 29+ minutes: its suites were bounded but\n# `cargo build` and\
      \ `npm ci` were not, so a cold sandbox installing a\n# toolchain and compiling from scratch had\
