name: Review swarm

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: review-swarm-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # Per RFC-0001 §2 rule 7: "Every PR is met by a review swarm." No author
    # filter — human PRs get reviewed too. If we ever need a rollout-scoped
    # narrower filter, express it as a documented rule, not a hardcoded
    # username list.
    runs-on: ubuntu-latest
    # Job cap must exceed the poll deadline (65min) + install overhead.
    # 75min gives 10min headroom for checkout, npm install, sync, post.
    timeout-minutes: 75
    env:
      GH_TOKEN: ${{ github.token }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      RELAY_WORKSPACE_KEY: ${{ secrets.RELAY_WORKSPACE_KEY }}
    steps:
      - name: Check out PR merge commit
        uses: actions/checkout@v4
        with:
          ref: refs/pull/${{ github.event.pull_request.number }}/merge
          fetch-depth: 0

      - name: Install agent-relay
        run: npm install --global agent-relay@11.8.7

      - name: Set review target
        run: echo "$PR_NUMBER" > .review-target

      - name: Launch review swarm
        id: launch
        shell: bash
        run: |
          set -euo pipefail
          response=$(agent-relay cloud run workflows/review-swarm.yaml --json)
          printf '%s\n' "$response"
          run_id=$(jq -er '.runId // .id // .run.id' <<<"$response")
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"

      - name: Wait for review swarm
        id: wait
        shell: bash
        env:
          RUN_ID: ${{ steps.launch.outputs.run_id }}
        # Poll deadline (3900s = 65min) must be >= workflows/review-swarm.yaml's
        # own timeoutMs (3600000 = 60min) plus buffer, or CI abandons swarms
        # still executing in cloud. The job's timeout-minutes must exceed 65.
        # Record the terminal status in an output so the next step can post
        # transcripts EVEN when the swarm rejects — otherwise a rejecting
        # swarm's evidence never reaches the PR.
        run: |
          set -euo pipefail
          deadline=$((SECONDS + 3900))
          while (( SECONDS < deadline )); do
            response=$(agent-relay cloud status "$RUN_ID" --json)
            printf '%s\n' "$response"
            status=$(jq -er '.status // .run.status' <<<"$response")
            case "$status" in
              completed|failed|errored|cancelled|canceled)
                echo "swarm_status=$status" >> "$GITHUB_OUTPUT"
                exit 0 ;;
            esac
            sleep 30
          done
          echo "swarm_status=timeout" >> "$GITHUB_OUTPUT"

      - name: Sync and post review comments
        # ALWAYS run, even if wait recorded a non-completed status. A rejecting
        # swarm's transcripts and marker are the evidence we need on the PR;
        # skipping this step on failure is exactly the evidence-loss class
        # ops/DRIVE-LOG.md warns about.
        if: always() && steps.launch.outputs.run_id != ''
        env:
          RUN_ID: ${{ steps.launch.outputs.run_id }}
        run: bash .github/workflows/scripts/swarm-post.sh "$RUN_ID" "$PR_NUMBER"

      - name: Fail the job when swarm rejected
        # Post-transcript gate: the marker comment now records the verdict on
        # the PR, so we can safely fail the CI check to block merge.
        if: steps.wait.outputs.swarm_status != 'completed'
        run: |
          echo "Swarm terminated with status: ${{ steps.wait.outputs.swarm_status }}" >&2
          exit 1
