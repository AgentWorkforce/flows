name: Review swarm

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: review-swarm-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    # Ordering invariant: job 75m > poll 3900s (65m) > swarm 3600000ms (60m).
    timeout-minutes: 75
    steps:
      - name: Check out immutable gate from main
        uses: actions/checkout@v4
        with:
          ref: main
          path: gate

      - name: Check out PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: target

      - name: Validate workspace secret
        env:
          RELAY_WORKSPACE_KEY: ${{ secrets.RELAY_WORKSPACE_KEY }}
        run: |
          if [ -z "$RELAY_WORKSPACE_KEY" ]; then
            echo "RELAY_WORKSPACE_KEY secret not configured; see README § Review-swarm secret" >&2
            exit 1
          fi

      - name: Install Agent Relay CLI
        run: npm install --global agent-relay

      - name: Fetch PR evidence on runner
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: target
        run: ../gate/.github/workflows/scripts/swarm-prepare.sh '${{ github.event.pull_request.number }}' ../gate

      - name: Launch cloud swarm
        id: launch
        env:
          RELAY_API_KEY: ${{ secrets.RELAY_WORKSPACE_KEY }}
        working-directory: target
        run: |
          result=$(agent-relay cloud run --json ../gate/workflows/review-swarm.yaml)
          run_id=$(printf '%s' "$result" | jq -er '.runId // .id')
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"

      - name: Wait for cloud swarm
        id: wait
        if: steps.launch.outputs.run_id != ''
        env:
          RELAY_API_KEY: ${{ secrets.RELAY_WORKSPACE_KEY }}
        run: |
          deadline=$((SECONDS + 3900))
          swarm_status=timed_out
          while [ "$SECONDS" -lt "$deadline" ]; do
            status_json=$(agent-relay cloud status --json '${{ steps.launch.outputs.run_id }}') || {
              swarm_status=status_error
              break
            }
            swarm_status=$(printf '%s' "$status_json" | jq -r '.status // "unknown"')
            case "$swarm_status" in
              completed|failed|cancelled) break ;;
            esac
            sleep 15
          done
          echo "swarm_status=$swarm_status" >> "$GITHUB_OUTPUT"
          # Deliberately exit zero: post must publish evidence for rejected runs.
          exit 0

      - name: Sync and post review
        if: always() && steps.launch.outputs.run_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RELAY_API_KEY: ${{ secrets.RELAY_WORKSPACE_KEY }}
        run: gate/.github/workflows/scripts/swarm-post.sh '${{ steps.launch.outputs.run_id }}' '${{ github.event.pull_request.number }}' '${{ github.repository }}' "$GITHUB_WORKSPACE/target"

      - name: Enforce terminal success
        if: steps.wait.outputs.swarm_status != 'completed'
        run: |
          echo "Review swarm did not complete: ${{ steps.wait.outputs.swarm_status }}" >&2
          exit 1
