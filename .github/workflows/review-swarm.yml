name: Review swarm

on:
  # Runs in the base repository so secrets are available for every PR,
  # including forks. Only separately checked-out main files are executed.
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: review-swarm-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: github.event.pull_request.draft == false
    # Ordering invariant: job 75m > poll 65m > swarm 60m.
    timeout-minutes: 75
    runs-on: ubuntu-latest
    steps:
      - name: Check out immutable gate from main
        uses: actions/checkout@v4
        with:
          ref: main
          path: gate
          sparse-checkout: |
            workflows/review-swarm.yaml
            .github/workflows/scripts/swarm-post.sh
            .github/workflows/scripts/swarm-prepare.sh

      - name: Check out pull request head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: target

      - name: Validate workspace secret
        env:
          RELAY_WORKSPACE_KEY: ${{ secrets.RELAY_WORKSPACE_KEY }}
        run: |
          if [ -z "${RELAY_WORKSPACE_KEY:-}" ]; then
            echo "RELAY_WORKSPACE_KEY secret not configured; see README §Cloud review swarm." >&2
            exit 1
          fi

      - name: Install Agent Relay
        run: npm install --global agent-relay

      - name: Prepare review input on launching host
        env:
          GH_TOKEN: ${{ github.token }}
        run: gate/.github/workflows/scripts/swarm-prepare.sh "${{ github.event.pull_request.number }}" target gate/.github/workflows/scripts/swarm-post.sh

      - name: Launch immutable review swarm
        id: launch
        working-directory: target
        env:
          RELAY_WORKSPACE_KEY: ${{ secrets.RELAY_WORKSPACE_KEY }}
        run: |
          response=$(agent-relay cloud run "$GITHUB_WORKSPACE/gate/workflows/review-swarm.yaml" --sync-code --json)
          run_id=$(printf '%s' "$response" | jq -r '.runId // .run_id // .id // empty')
          if [ -z "$run_id" ]; then
            echo "Cloud launch returned no run id: $response" >&2
            exit 1
          fi
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"

      - name: Wait for terminal status
        id: wait
        if: steps.launch.outputs.run_id != ''
        env:
          RELAY_WORKSPACE_KEY: ${{ secrets.RELAY_WORKSPACE_KEY }}
        run: |
          # Ordering invariant: job 75m > this 3900s (65m) poll > swarm 60m.
          deadline=$((SECONDS + 3900))
          swarm_status=timed_out
          while [ "$SECONDS" -lt "$deadline" ]; do
            response=$(agent-relay cloud status "${{ steps.launch.outputs.run_id }}" --json 2>/dev/null) || {
              sleep 15
              continue
            }
            status=$(printf '%s' "$response" | jq -r '.status // .run.status // empty')
            case "$status" in
              completed|failed|cancelled)
                swarm_status=$status
                break
                ;;
            esac
            sleep 15
          done
          echo "swarm_status=$swarm_status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Sync evidence and update sticky comments
        if: always() && steps.launch.outputs.run_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gate/.github/workflows/scripts/swarm-post.sh post "${{ steps.launch.outputs.run_id }}" "${{ github.event.pull_request.number }}" target

      - name: Enforce successful terminal status
        if: steps.wait.outputs.swarm_status != 'completed'
        run: |
          echo "Review swarm ended with status: ${{ steps.wait.outputs.swarm_status || 'not_started' }}" >&2
          exit 1
