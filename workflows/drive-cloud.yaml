      \ the kernel suite now contains a test that\n# intermittently hangs under sandbox timing:\n# an_entry_appended_during_watch_registration_is_delivered_exactly_once\n\
      # ran past 60s in cloud while passing locally in 0.54s. Without a\n# bound here, one hanging test\
      \ consumes the entire run budget.\nrun_bounded() {\n  _label=\"$1\"; shift\n  if command -v timeout\
      \ >/dev/null 2>&1; then\n    timeout \"${VERIFY_SUITE_TIMEOUT:-900}\" \"$@\"\n  elif command -v\
