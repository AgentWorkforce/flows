version: '1.0'
name: flows-review-swarm
description: >
  Three independent reviewers, three lenses, three model families — the review
  team RFC-0001 §2 rule 7 requires. Exists because external bots are not
  review signal: on PR #8 CodeRabbit was rate-limited into skipping and Devin's
  trial expired, both reporting SUCCESS. Our own review must not depend on
  someone else's quota.

  Invoke with PR_NUMBER set. Each lens persists its own transcript to
  ops/reviews/; the aggregate step fails the run if ANY lens rejects, so a
  single honest refusal blocks the merge.

swarm:
  pattern: dag
  channel: flows-review
  # Ordering invariant: this 60m timeout < GHA poll 65m < GHA job 75m.
  timeoutMs: 3600000
  maxConcurrency: 3

agents:
  # Deliberately three different model families: a shared blind spot in one
  # harness must not become the whole team's blind spot.
  - name: maintainability
    cli: claude
    preset: reviewer
    role: >-
      MAINTAINABILITY lens. Could a stranger read this diff in six months and
      change it safely? Name unclear boundaries, implicit contracts, missing
      failure handling, comments that assert what the code does not do, and
      tests that would not fail if the behavior broke. Head a section exactly
      `### Blockers`; write None under it when there are none. Your final
      REVIEW_PASSED/REVIEW_FAILED token is DERIVED from that section — concerns
      and notes are not blockers and must not change it.
  - name: history
    cli: codex
    preset: reviewer
    role: >-
      HISTORY lens. Does this fit the story of the code? Reject ONLY when the
      diff repeats a mistake ops/DRIVE-LOG.md records, or introduces a NEW
      contradiction with a settled RFC-0001 decision, or claims evidence it did
      not produce. Head a section exactly `### Blockers`; write None under it
      when there are none. Your final REVIEW_PASSED/REVIEW_FAILED token is
      DERIVED from that section — concerns and notes must not change it.
  - name: structure
    cli: opencode
    preset: reviewer
    role: >-
      STRUCTURE lens. Boundaries, coupling, file size, single purpose. Does the
      shape match RFC-0001 (closed kernel vocabulary, helpers over primitives,
      fail-closed, completionReason discipline) and AGENTS.md? Name anything
      that puts product logic in the kernel, adds a primitive instead of a
      helper, or grows a file past its purpose. Head a section exactly
      `### Blockers`; write None under it when there are none. Your final
      REVIEW_PASSED/REVIEW_FAILED token is DERIVED from that section — concerns
      and notes must not change it.

workflows:
  - name: review-pr
    steps:
      - name: fetch
        type: deterministic
        command: |
          set -u
          PR=$(tr -dc '0-9' < .review-target/pr-number)
          [ -s .review-target/pr.diff ] || { echo "FETCH_FAILED: staged PR diff missing"; exit 1; }
          [ -s .review-target/pr.json ] || { echo "FETCH_FAILED: staged PR metadata missing"; exit 1; }
          cp .review-target/pr.diff "/tmp/pr-$PR.diff"
          cp .review-target/pr.json "/tmp/pr-$PR.json"
          echo "target PR #$PR, $(wc -l < .review-target/pr.diff) diff lines"
          echo FETCHED

      - name: lens-maintainability
        type: agent
        agent: maintainability
        dependsOn: [fetch]
        task: |
          Review the PR whose number is in .review-target (diff at
          /tmp/pr-<n>.diff, metadata at /tmp/pr-<n>.json) through ONE lens: maintainability.
          Ask: could a stranger read this in six months and change it safely?
          Name unclear boundaries, implicit contracts, missing failure handling,
          comments that assert what the code does not do, and tests that would
          not fail if the behavior broke.
          Read AGENTS.md and docs/RFC-0001-everything-is-a-relayflow.md first.
          Write your complete review to
          ops/reviews/$(date +%Y%m%d-%H%M)-pr$(cat .review-target/pr-number)-maintainability.md
          and `git add` it. The LAST NON-EMPTY LINE OF THE TRANSCRIPT FILE must be exactly REVIEW_PASSED or REVIEW_FAILED, with nothing after it -- no sign-off, no timestamp, no closing sentence. swarm-verdict.sh reads only that final line; a marker followed by any trailing text is read as UNCLEAR and your entire review is discarded.
        verification:
          type: output_contains
          value: "REVIEW_"
        maxIterations: 1
        timeoutMs: 1800000

      - name: lens-history
        type: agent
        agent: history
        dependsOn: [fetch]
        task: |
          Review the PR whose number is in .review-target (diff at /tmp/pr-<n>.diff) through ONE
          lens: does this change fit the story of the code?
          Run `git log --oneline -40` and read ops/DRIVE-LOG.md, ops/NEXT.md and
          ops/DIRECTIVES.md if present. Ask: does it repeat a mistake the log
          already records? Does it contradict a settled decision in RFC-0001?
          Does it reintroduce something a previous commit deliberately removed?
          Does the commit message tell the truth about the diff?
          Write your complete review to
          ops/reviews/$(date +%Y%m%d-%H%M)-pr$(cat .review-target/pr-number)-history.md and
          `git add` it. The LAST NON-EMPTY LINE OF THE TRANSCRIPT FILE must be exactly REVIEW_PASSED or REVIEW_FAILED, with nothing after it -- no sign-off, no timestamp, no closing sentence. swarm-verdict.sh reads only that final line; a marker followed by any trailing text is read as UNCLEAR and your entire review is discarded.
        verification:
          type: output_contains
          value: "REVIEW_"
        maxIterations: 1
        timeoutMs: 1800000

      - name: lens-structure
        type: agent
        agent: structure
        dependsOn: [fetch]
        task: |
          Review the PR whose number is in .review-target (diff at /tmp/pr-<n>.diff) through ONE
          lens: structure. Boundaries, coupling, file size and single purpose,
          whether the shape matches RFC-0001 (closed kernel vocabulary, helpers
          over primitives, fail-closed, completionReason discipline) and
          AGENTS.md. Name anything that puts product logic in the kernel, adds
          a primitive instead of a helper, or grows a file past its purpose.
          Write your complete review to
          ops/reviews/$(date +%Y%m%d-%H%M)-pr$(cat .review-target/pr-number)-structure.md and
          `git add` it. The LAST NON-EMPTY LINE OF THE TRANSCRIPT FILE must be exactly REVIEW_PASSED or REVIEW_FAILED, with nothing after it -- no sign-off, no timestamp, no closing sentence. swarm-verdict.sh reads only that final line; a marker followed by any trailing text is read as UNCLEAR and your entire review is discarded.
        verification:
          type: output_contains
          value: "REVIEW_"
        maxIterations: 1
        timeoutMs: 1800000

      - name: persist-transcripts
        type: deterministic
        dependsOn: [lens-maintainability, lens-history, lens-structure]
        command: |
          # Lens verdicts are evidence even when the aggregate rejects. Commit
          # exactly the review files the lenses staged before any later reset
          # can destroy them.
          set -u
          PR=$(tr -dc '0-9' < .review-target/pr-number 2>/dev/null)
          if ! git diff --cached --quiet -- ops/reviews/; then
            git commit -m "ops(review): persist PR #${PR} swarm transcripts" -- ops/reviews/
          fi

      - name: aggregate
        type: deterministic
        dependsOn: [persist-transcripts]
        command: |
          set -u
          . .github/workflows/scripts/swarm-verdict.sh
          PR=$(tr -dc '0-9' < .review-target/pr-number 2>/dev/null)
          fail=0
          for lens in maintainability history structure; do
            result=$(swarm_lens_result ops/reviews "$PR" "$lens" .review-target/run-start)
            verdict=${result%%$'\t'*}
            f=${result#*$'\t'}
            if [ "$verdict" = PASSED ]; then echo "ok: $lens passed ($f)"
            else echo "SWARM_FAILED: $lens is $verdict ($f)"; fail=1; fi
          done
          [ $fail -eq 0 ] && echo SWARM_PASSED || exit 1
        timeoutMs: 120000
