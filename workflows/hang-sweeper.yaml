version: '1.0'
name: flows-hang-sweeper
description: >
  Cloud-resident floor for unattended operation. A fleet agent runs its task
  once and exits — one autopilot died silently 20 minutes in — so the mini
  chain cannot be the only thing watching overnight. This runs on a cloud
  schedule instead, needs no repo (scheduled runs get no working tree), and
  does the one thing that must not be missed: notice a hung run, cancel it,
  and say so.
swarm:
  pattern: pipeline
  channel: flows-drive-cloud
  timeoutMs: 1200000
agents:
  - name: sweeper
    cli: claude
    preset: analyst
    role: Detects and cancels hung drive runs, and reports what it did.
workflows:
  - name: sweep
    steps:
      - name: sweep
        type: agent
        agent: sweeper
        task: |
          You are the hang sweeper for the flows drive loop. Khaliq is away.
          You run on a schedule in a cloud sandbox with NO repo checkout — do
          not attempt git operations, and do not try to launch or deliver runs.
          Your one job is to stop a hung run from silently burning its budget.

          1. List recent runs and their state. Use the agent-relay CLI:
             `agent-relay cloud schedules` for the schedule rows, and
             `agent-relay cloud status <runId>` / `agent-relay cloud logs <runId> | tail -20`
             for any run you find that is still running.

          2. Decide hang vs healthy from LOG SILENCE, not from timeoutMs. The
             platform does NOT enforce timeoutMs — established on 2026-08-28,
             where a step ran 42 minutes against a 30 minute bound and was
             never killed. Thresholds:
               - deterministic step (verify, assess-gate, commit): silent 25+ min = hung
               - agent step (assess, build, review): silent 40+ min = hung

          3. Cancel ONLY a genuine hang: `agent-relay cloud cancel <runId>`.
             Cancelling PERMANENTLY destroys that run's patch — sync answers
             409 forever afterwards — while a FAILED run keeps its patch. So a
             run that is merely slow, or failing, must be left alone. When in
             doubt, leave it and say why.

          4. Post ONE message to the flows-drive-cloud channel, and only if
             something is worth saying: what you cancelled and on what
             evidence, or what looks stuck that you deliberately did not
             cancel. If everything is healthy, say so in one line. Never claim
             a check you did not run — paste the literal command output.

          End with SWEEPER_DONE.
        verification:
          type: output_contains
          value: SWEEPER_DONE
        timeoutMs: 900000
