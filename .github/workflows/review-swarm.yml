name: Review swarm

on:
  # Runs main's workflow definition, so the reviewed head cannot alter its judge.
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write

# Ordering invariant: job 75m > poll 65m > swarm 60m.
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Check out immutable gate from main
        uses: actions/checkout@v4
        with:
          ref: main
          path: gate

      - name: Check out pull request head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: target

      - name: Validate cloud authentication
        env:
          RELAY_WORKSPACE_KEY: ${{ secrets.RELAY_WORKSPACE_KEY }}
        run: |
          if [ -z "$RELAY_WORKSPACE_KEY" ]; then
            echo "RELAY_WORKSPACE_KEY secret not configured; see README §Review swarm secret" >&2
            exit 1
          fi

      - name: Install Agent Relay
        run: npm install --global agent-relay

      - name: Prepare pull request evidence
        working-directory: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/workflows/scripts/swarm-prepare.sh '${{ github.event.pull_request.number }}'

      - name: Launch immutable review swarm
        id: launch
        working-directory: gate
        env:
          RELAY_WORKSPACE_KEY: ${{ secrets.RELAY_WORKSPACE_KEY }}
        run: |
          output=$(agent-relay cloud run workflows/review-swarm.yaml --sync-code --json)
          printf '%s\n' "$output"
          run_id=$(printf '%s\n' "$output" | python3 -c 'import json,sys; print(json.load(sys.stdin)["runId"])')
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"

      # Ordering invariant: poll 3900s (65m) > swarm 3600s (60m).
      - name: Wait for terminal status
        id: wait
        if: steps.launch.outputs.run_id != ''
        env:
          RELAY_WORKSPACE_KEY: ${{ secrets.RELAY_WORKSPACE_KEY }}
        run: |
          deadline=$((SECONDS + 3900))
          status=timed_out
          while [ "$SECONDS" -lt "$deadline" ]; do
            if ! response=$(agent-relay cloud status '${{ steps.launch.outputs.run_id }}'); then
              status=status_error
              break
            fi
            status=$(printf '%s\n' "$response" | sed -n 's/^Status:[[:space:]]*//p' | head -n 1)
            case "$status" in
              completed|failed|cancelled|interrupted) break ;;
            esac
            sleep 15
          done
          echo "swarm_status=${status:-unknown}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Sync and post review evidence
        if: always() && steps.launch.outputs.run_id != ''
        working-directory: gate
        env:
          GH_TOKEN: ${{ github.token }}
          RELAY_WORKSPACE_KEY: ${{ secrets.RELAY_WORKSPACE_KEY }}
        run: |
          sync_started=$(date +%s)
          agent-relay cloud sync '${{ steps.launch.outputs.run_id }}' --dir .
          .github/workflows/scripts/swarm-post.sh \
            '${{ github.event.pull_request.number }}' \
            '${{ steps.launch.outputs.run_id }}' . "$sync_started"

      - name: Enforce successful terminal status
        if: steps.wait.outputs.swarm_status != 'completed'
        run: |
          echo "review swarm did not complete: ${{ steps.wait.outputs.swarm_status }}" >&2
          exit 1
