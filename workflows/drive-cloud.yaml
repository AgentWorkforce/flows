  channel: flows-drive-cloud
  timeoutMs: 3600000
agents:
- name: lead
  cli: claude
  preset: analyst
  role: The Relayflow Lead. Assesses state, plans one work package, reports honestly.
- name: builder
  cli: codex
  preset: worker
  role: Implements the work package. Rust for kernel/, TypeScript for sdk/.
- name: adversary
  cli: claude
  preset: reviewer
  role: Adversarial reviewer against RFC-0001 and AGENTS.md.
workflows:
- name: drive-cloud-loop
  steps:
  - name: sync
    type: deterministic
    command: "# Materialize the repo; never assume it. This step assumed a clone\n# with an `origin` remote\
      \ and so every cloud tick died here with\n# `fatal: 'origin' does not appear to be a git repository`\
      \ (runs\n# 9fc8d996, ff35187a, 06505b94, 4cf36ea7, b33c2c9a).\n#\n# A cloud workflow sandbox does\
      \ NOT get a clone. The platform's own\n# materialization is the code sync: the CLI tars the `git\
      \ ls-files`\n# set and the bootstrap extracts it into the code mount, then runs\n# `git init` over\
      \ it. Files yes, `.git` history and remotes no.\n# A checkout with a remote only exists on a host\
      \ that already has one\n# (laptop, fleet node). Both shapes are supported below; neither is\n# assumed,\
      \ and an unmaterialized sandbox fails closed and typed\n# rather than failing later as an unexplained\
      \ tool error.\nset -eu\necho \"SYNC_WORKDIR=$(pwd)\"\n\nmissing=\"\"\nfor required in AGENTS.md\
      \ docs/RFC-0001-everything-is-a-relayflow.md ops/DIRECTIVES.md kernel sdk; do\n  [ -e \"$required\"\
      \ ] || missing=\"$missing $required\"\ndone\nif [ -n \"$missing\" ]; then\n  echo \"SYNC_FAIL_NOT_MATERIALIZED:\
      \ the repo is not present in this execution environment.\" >&2\n  echo \"  missing:$missing\" >&2\n\
      \  echo \"  cwd: $(pwd)\" >&2\n  echo \"  A cloud run must upload the working tree: \\`agent-relay\
      \ cloud run\\`\" >&2\n  echo \"  syncs code by default; \\`--no-sync-code\\` produces exactly this\
      \ state.\" >&2\n  exit 78\nfi\necho \"SYNC_MATERIALIZED=ok\"\n\ngit rev-parse --git-dir >/dev/null\
      \ 2>&1 || git init -q\ngit config user.email \"lead@relayflows.local\"\ngit config user.name \"\
      Relayflow Lead\"\n\nif git remote get-url origin >/dev/null 2>&1; then\n  # Real checkout (laptop\
      \ / fleet node): take the true origin/main.\n  echo \"SYNC_MODE=remote\"\n  git fetch --quiet origin\n\
      \  git checkout --quiet -B main origin/main\n  base=$(git rev-parse --short origin/main)\nelse\n\
      \  # Sandbox snapshot: there is no remote to fetch and nothing to\n  # rebase onto. The snapshot\
      \ IS the base. Commit it so the tick has\n  # a parent to diff against \u2014 `git diff main` in\
      \ the review step\n  # needs a `main` that exists.\n  echo \"SYNC_MODE=snapshot\"\n  if ! git rev-parse\
      \ --verify --quiet HEAD >/dev/null 2>&1; then\n    git add -A\n    git commit --quiet -m \"snapshot\
      \ base for this tick\" || true\n  fi\n  git branch --quiet -f main HEAD 2>/dev/null || git checkout\
      \ --quiet -b main\n  base=$(git rev-parse --short HEAD)\nfi\n\ngit checkout --quiet -B \"flow/drive-${base}-$(date\
      \ +%m%d%H%M)\"\necho \"SYNC_BASE=$base\"\necho \"SYNC_BRANCH=$(git rev-parse --abbrev-ref HEAD)\"\
      \necho SYNCED\n"
  - name: assess-1
    type: agent
    agent: lead
    dependsOn:
    - sync
    task: "You are the Relayflow Lead (charter/LEAD.md). Assess the repo:\nFIRST, if ops/TARGET.md exists,\
      \ it names the ONE gate this run must\nwork on. It is the operator's scoping decision and it overrides\
      \ your\nown judgement about priority \u2014 several runs execute in parallel, each\npinned to a\
      \ different gate, and a run that wanders outside its target\nwill collide with a sibling. Stay inside\
      \ it or, if the target is\ngenuinely unreachable, say so in ops/NEEDS_HUMAN.md rather than\nsilently\
      \ choosing different work.\nThen read ops/STATE.md \u2014 it is ground truth about gates and open\n\
      PRs for an environment with no git history, and it names the known\nsandbox faults that are NOT\
      \ reasons to block. Then read\nops/DIRECTIVES.md \u2014 standing human directives outrank the backlog;\n\
      if one is unsatisfied, it IS the work package.\nThen read docs/bootstrap-report.md and ops/DRIVE-LOG.md\
      \ if they exist,\n`git log --oneline -15`, `gh pr list --state open` and open PR review\nstate,\
      \ kernel/ and sdk/ test status. Then write ops/NEXT.md: the\nSINGLE highest-priority work package\
      \ toward the current gate\n(gate 1 until its done-when in RFC-0001 \xA73 holds), with: objective,\n\
      files in scope, definition of done (must include passing commands),\nand what is explicitly OUT\
      \ of scope for this tick. If an open PR is\nawaiting fixes from review, the work package is fixing\
      \ it \u2014 never\nstart new work over unfinished work. If work is blocked on a human\ndecision,\
      \ write ops/NEEDS_HUMAN.md stating the exact question and the\noptions \u2014 and then STILL end\
      \ with ASSESS_DONE.\n\nCOMMIT YOUR WORK PACKAGE BEFORE YOU FINISH:\n  git add -A && git commit -m\
      \ \"assess: work package for this tick\"\nEach step runs in its OWN sandbox and files reach the\
      \ next step only\nthrough the executor's propagation, which is lossy: on runs a2089144\nand 2560e02d\
      \ your predecessor wrote ops/NEXT.md, said so truthfully,\nand the file never arrived \u2014 one\
      \ of those runs finished with a\nzero-file patch. Committing puts the package in git history rather\n\
      than leaving it as a loose working-tree file. If the commit fails,\nsay so in your output rather\
      \ than finishing silently. The assess-gate step\nbelow reads that file and parks the run with a\
      \ typed outcome.\nALWAYS end with ASSESS_DONE, blocked or not: this gate cannot tell a\ndifferent\
      \ final token from a crashed agent, so on run 54ebd998 the\nLead correctly reported BLOCKED_NEEDS_HUMAN\
      \ three times and was\nscored as failing three times. Saying you are blocked is a result,\nnot a\
      \ failure \u2014 but it must be said in the file, not the token.\n"
    verification:
      type: output_contains
      value: ASSESS_DONE
    timeoutMs: 1800000
  - name: assess-gate-1
    type: deterministic
    dependsOn:
    - assess-1
    command: "# A typed park, not a crash. The assess step cannot express \"blocked\"\n# in its final\
      \ token (its gate only recognises ASSESS_DONE), so the\n# Lead writes ops/NEEDS_HUMAN.md instead\
      \ and this step reads it.\nset -u\nif [ -f ops/NEEDS_HUMAN.md ]; then\n  echo \"ASSESS_BLOCKED_NEEDS_HUMAN:\
      \ the Lead escalated a decision it cannot make.\"\n  echo \"--- ops/NEEDS_HUMAN.md ---\"\n  cat\
      \ ops/NEEDS_HUMAN.md\n  exit 75\nfi\nif [ ! -f ops/NEXT.md ]; then\n  echo \"ASSESS_FAIL: no ops/NEXT.md\
      \ \u2014 an assessment that named no work package did not assess\"\n  exit 1\nfi\n# The assessment\
      \ must have WRITTEN this tick's package, not merely\n# left the previous one in place. On run 457a6102\
      \ assess reported\n# \"The work package is written to ops/NEXT.md\" and the very next step\n# read\
      \ the OLD file \u2014 the logs carry the reason:\n#   \"relayfile flush failed after the command\
      \ succeeded (exit 1);\n#    a later agent step may see stale files\"\n# The builder then correctly\
      \ refused to invent scope, but only after\n# a whole build step had been spent. Catch it here instead:\
      \ if\n# ops/NEXT.md is identical to the base, the assessment did not land,\n# whoever is at fault.\n\
      # Look for the package in the working tree OR in a commit made this\n# tick. Propagation between\
      \ per-step sandboxes is lossy, so a package\n# that exists only as a loose file may not arrive;\
      \ one committed by\n# the assess step travels in git history instead.\nif git log --oneline main..HEAD\
      \ -- ops/NEXT.md 2>/dev/null | grep -q .; then\n  echo \"ASSESS_PACKAGE_COMMITTED: found ops/NEXT.md\
      \ change in this tick's history\"\nelif git diff --quiet main -- ops/NEXT.md 2>/dev/null; then\n\
      \  # Warn, do not fail. This was fatal, and it killed four runs in six\n  # while the loop produced\
      \ nothing \u2014 a worse outcome than the risk\n  # it guarded against.\n  #\n  # The risk it guarded\
      \ was \"the builder gets scope nobody wrote this\n  # tick\". But scope does not actually come from\
      \ ops/NEXT.md: it comes\n  # from ops/TARGET.md, which the launcher COMMITS into the uploaded\n\
      \  # tree, so it is present in every per-step sandbox and cannot be\n  # lost to the propagation\
      \ fault. NEXT.md refines the target; it does\n  # not define it.\n  echo \"ASSESS_WARN_STALE_NEXT:\
      \ ops/NEXT.md did not change from the base commit.\"\n  echo \"  The assess step's package did not\
      \ survive the step boundary (a known\"\n  echo \"  platform fault: per-step sandboxes lose both\
      \ loose files and git objects).\"\n  echo \"  Proceeding, because ops/TARGET.md is committed in\
      \ the tree and carries this\"\n  echo \"  run's scope. The builder is not working blind \u2014 it\
      \ is working from the\"\n  echo \"  target rather than from a refinement of it.\"\n  if [ -f ops/TARGET.md\
      \ ]; then\n    echo \"--- ops/TARGET.md (the scope that did survive) ---\"\n    head -8 ops/TARGET.md\n\
      \  else\n    echo \"ASSESS_FAIL_NO_SCOPE: neither a fresh ops/NEXT.md nor an ops/TARGET.md.\"\n\
      \    echo \"  With no scope from either source the builder WOULD be working blind.\"\n    exit 1\n\
      \  fi\nfi\n# A package with no definition of done cannot be verified, and the\n# builder cannot\
      \ honestly report BUILD_DONE against it.\n# A package must be verifiable, but do not dictate its\
      \ wording. This\n# check demanded the literal phrase \"definition of done\" and so\n# rejected a\
      \ CORRECT assessment three times on run 30475b25 \u2014 one\n# that reported gate 2's primitives\
      \ already complete and proposed\n# moving to gate 3, and was right on both counts. A gate that\n\
      # rejects true reports is as bad as one that accepts false ones.\n#\n# Accept either shape: a runnable\
      \ command (that is what \"verifiable\"\n# actually means), or an explicit statement that this tick\
      \ has no\n# buildable package.\nif grep -qiE \"definition of done|definition-of-done|done when|done-when|acceptance\
      \ criteria\" ops/NEXT.md \\\n   || grep -qE \"(cargo|npm|node|sh|pytest) [a-z]\" ops/NEXT.md \\\n\
      \   || grep -qiE \"no buildable work|nothing to build|assessment only|gate .* is (green|complete)\"\
      \ ops/NEXT.md; then\n  :\nelse\n  echo \"ASSESS_FAIL_NO_DOD: ops/NEXT.md names neither a runnable\
      \ command nor a\"\n  echo \"  statement that this tick has no buildable package. A work package\
      \ that\"\n  echo \"  cannot be verified cannot be built against.\"\n  exit 1\nfi\necho \"ASSESS_GATE_PASS\
      \ ($(grep -m1 -oE 'WP-[0-9]+[^|]*' ops/NEXT.md || echo 'work package'))\"\n"
    timeoutMs: 120000
