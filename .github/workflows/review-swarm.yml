name: Review swarm

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: review-swarm-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: >-
      github.event.pull_request.user.login == 'kjgbot' ||
      github.event.pull_request.user.login == 'miyaontherelay'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      GH_TOKEN: ${{ github.token }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      RELAY_WORKSPACE_KEY: ${{ secrets.RELAY_WORKSPACE_KEY }}
    steps:
      - name: Check out PR merge commit
        uses: actions/checkout@v4
        with:
          ref: refs/pull/${{ github.event.pull_request.number }}/merge
          fetch-depth: 0

      - name: Install agent-relay
        run: npm install --global agent-relay@11.8.7

      - name: Set review target
        run: echo "$PR_NUMBER" > .review-target

      - name: Launch review swarm
        id: launch
        shell: bash
        run: |
          set -euo pipefail
          response=$(agent-relay cloud run workflows/review-swarm.yaml --json)
          printf '%s\n' "$response"
          run_id=$(jq -er '.runId // .id // .run.id' <<<"$response")
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"

      - name: Wait for review swarm
        shell: bash
        env:
          RUN_ID: ${{ steps.launch.outputs.run_id }}
        # Poll deadline (3900s = 65min) must be >= workflows/review-swarm.yaml's
        # own timeoutMs (3600000 = 60min) plus buffer, or CI abandons swarms
        # still executing in cloud. Exit on ALL terminal states so a real
        # failure/cancel doesn't masquerade as a 65-min timeout.
        run: |
          set -euo pipefail
          deadline=$((SECONDS + 3900))
          while (( SECONDS < deadline )); do
            response=$(agent-relay cloud status "$RUN_ID" --json)
            printf '%s\n' "$response"
            status=$(jq -er '.status // .run.status' <<<"$response")
            case "$status" in
              completed) exit 0 ;;
              failed|errored|cancelled|canceled)
                echo "review swarm ended: $status" >&2
                exit 1 ;;
            esac
            sleep 30
          done
          echo "review swarm timed out after 65 minutes" >&2
          exit 1

      - name: Sync and post review comments
        env:
          RUN_ID: ${{ steps.launch.outputs.run_id }}
        run: bash .github/workflows/scripts/swarm-post.sh "$RUN_ID" "$PR_NUMBER"
