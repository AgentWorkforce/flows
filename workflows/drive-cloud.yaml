version: '1.0'
name: flows-drive-cloud
description: 'The Lead''s tick, shaped for a cloud sandbox with the laptop closed.

  A cloud sandbox has no git remote and no GitHub token, so this flow

  never delivers: it runs 1 full work-package cycles back to back

  in ONE sandbox, committing each to the sandbox branch. Recover the work

  with `agent-relay cloud sync <runId>`. Nothing reaches main without a

  human. GENERATED from workflows/drive.yaml by ops/gen-drive-cloud.py.

  '
swarm:
