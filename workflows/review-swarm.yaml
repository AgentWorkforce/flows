version: '1.0'
name: flows-review-swarm
description: >
  Three independent reviewers, three lenses, three model families — the review
  team RFC-0001 §2 rule 7 requires. Exists because external bots are not
  review signal: on PR #8 CodeRabbit was rate-limited into skipping and Devin's
  trial expired, both reporting SUCCESS. Our own review must not depend on
  someone else's quota.

  Invoke with PR_NUMBER set. Each lens persists its own transcript to
  ops/reviews/; the aggregate step fails the run if ANY lens rejects, so a
  single honest refusal blocks the merge.

swarm:
  pattern: dag
  channel: flows-review
  # Ordering invariant: 75m GHA job > 65m poll > this 60m swarm.
  timeoutMs: 3600000
  maxConcurrency: 3

agents:
  # Deliberately three different model families: a shared blind spot in one
  # harness must not become the whole team's blind spot.
  - name: maintainability
    cli: claude
    preset: reviewer
    role: Reviews for maintainability — will a stranger understand and safely change this in six months?
  - name: history
    cli: codex
    preset: reviewer
    role: Reviews the change against the story of the code — does it fit what the repo has been becoming?
  - name: structure
    cli: opencode
    preset: reviewer
    role: Reviews structure — boundaries, coupling, whether the shape matches the contract in RFC-0001.

workflows:
  - name: review-pr
    steps:
      - name: fetch
        type: deterministic
        command: |
          set -eu
          PR=$(tr -dc '0-9' < .review-target/pr-number)
          [ -n "$PR" ] || { echo "FETCH_FAILED: review target has no PR number"; exit 1; }
          [ -s .review-target/pr.diff ] || { echo "FETCH_FAILED: staged PR diff is empty"; exit 1; }
          [ -s .review-target/pr.json ] || { echo "FETCH_FAILED: staged PR metadata is empty"; exit 1; }
          # Created after the uploaded tree is materialized: pre-existing
          # transcripts therefore have an older mtime than this run boundary.
          date +%s > .review-target/sync-start
          echo "target PR #$PR, $(wc -l < .review-target/pr.diff) diff lines"
          echo FETCHED

      - name: lens-maintainability
        type: agent
        agent: maintainability
        dependsOn: [fetch]
        task: |
          Review the PR whose number, diff, and metadata are staged in
          .review-target/ through ONE lens: maintainability.
          Ask: could a stranger read this in six months and change it safely?
          Name unclear boundaries, implicit contracts, missing failure handling,
          comments that assert what the code does not do, and tests that would
          not fail if the behavior broke.
          Read AGENTS.md and docs/RFC-0001-everything-is-a-relayflow.md first.
          Write your complete review to
          ops/reviews/$(date +%Y%m%d-%H%M)-pr$(cat .review-target/pr-number)-maintainability.md
          and `git add` it. End your output with REVIEW_PASSED or REVIEW_FAILED.
        verification:
          type: output_contains
          value: "REVIEW_"
        maxIterations: 1
        timeoutMs: 1800000

      - name: lens-history
        type: agent
        agent: history
        dependsOn: [fetch]
        task: |
          Review the PR staged in .review-target/ through ONE
          lens: does this change fit the story of the code?
          Run `git log --oneline -40` and read ops/DRIVE-LOG.md, ops/NEXT.md and
          ops/DIRECTIVES.md if present. Ask: does it repeat a mistake the log
          already records? Does it contradict a settled decision in RFC-0001?
          Does it reintroduce something a previous commit deliberately removed?
          Does the commit message tell the truth about the diff?
          Write your complete review to
          ops/reviews/$(date +%Y%m%d-%H%M)-pr$(cat .review-target/pr-number)-history.md and
          `git add` it. End your output with REVIEW_PASSED or REVIEW_FAILED.
        verification:
          type: output_contains
          value: "REVIEW_"
        maxIterations: 1
        timeoutMs: 1800000

      - name: lens-structure
        type: agent
        agent: structure
        dependsOn: [fetch]
        task: |
          Review the PR staged in .review-target/ through ONE
          lens: structure. Boundaries, coupling, file size and single purpose,
          whether the shape matches RFC-0001 (closed kernel vocabulary, helpers
          over primitives, fail-closed, completionReason discipline) and
          AGENTS.md. Name anything that puts product logic in the kernel, adds
          a primitive instead of a helper, or grows a file past its purpose.
          Write your complete review to
          ops/reviews/$(date +%Y%m%d-%H%M)-pr$(cat .review-target/pr-number)-structure.md and
          `git add` it. End your output with REVIEW_PASSED or REVIEW_FAILED.
        verification:
          type: output_contains
          value: "REVIEW_"
        maxIterations: 1
        timeoutMs: 1800000

      - name: persist-transcripts
        type: deterministic
        dependsOn: [lens-maintainability, lens-history, lens-structure]
        command: |
          # Lens verdicts are evidence even when the aggregate rejects. Commit
          # exactly the review files the lenses staged before any later reset
          # can destroy them.
          set -u
          PR=$(tr -dc '0-9' < .review-target/pr-number 2>/dev/null)
          if ! git diff --cached --quiet -- ops/reviews/; then
            git commit -m "ops(review): persist PR #${PR} swarm transcripts" -- ops/reviews/
          fi

      - name: aggregate
        type: deterministic
        dependsOn: [persist-transcripts]
        command: |
          set -eu
          . .review-gate/scripts/swarm-verdict.sh
          PR=$(tr -dc '0-9' < .review-target/pr-number)
          sync_start=$(cat .review-target/sync-start)
          verdicts=""
          for lens in maintainability history structure; do
            name=$(swarm_latest_transcript ops/reviews "$PR" "$lens")
            f=${name:+ops/reviews/$name}
            verdict=$(swarm_transcript_verdict "$f")
            if [ -n "$f" ] && [ "$(stat -c %Y "$f")" -lt "$sync_start" ]; then verdict=STALE; fi
            echo "$lens: $verdict${f:+ ($f)}"
            verdicts="$verdicts $verdict"
          done
          # All three transcripts must be produced after this run's sync marker.
          # shellcheck disable=SC2086
          [ "$(swarm_overall_verdict $verdicts)" = PASSED ] && echo SWARM_PASSED || exit 1
        timeoutMs: 120000
