      \  # failed before `cargo build`, 150 passed after).\n  out=$(cd kernel && run_bounded \"kernel\
      \ build\" sh ../ops/cargo.sh build 2>&1); rc=$?\n  if [ $rc -ne 0 ]; then\n    echo \"$out\" | tail\
