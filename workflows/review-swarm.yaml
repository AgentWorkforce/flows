version: '1.0'
name: flows-review-swarm
description: Three independent review lenses required by RFC-0001 §2 rule 7.

swarm:
  pattern: dag
  channel: flows-review
  # Ordering invariant: swarm 60m < host poll 65m < GHA job 75m.
  timeoutMs: 3600000
  maxConcurrency: 3

agents:
  - name: maintainability
    cli: claude
    preset: reviewer
    role: Reviews whether a stranger can understand and safely change the code.
  - name: history
    cli: codex
    preset: reviewer
    role: Reviews whether the change fits the repository's recorded decisions.
  - name: structure
    cli: opencode
    preset: reviewer
    role: Reviews boundaries, coupling, and conformance to RFC-0001.

workflows:
  - name: review-pr
    steps:
      - name: load-target
        type: deterministic
        command: |
          set -eu
          for file in pr-number pr.diff pr.json; do
            [ -s ".review-target/$file" ] || {
              echo "TARGET_FAILED: .review-target/$file missing or empty" >&2
              exit 1
            }
          done
          date +%s > .review-target/sync-start
          echo "target PR #$(cat .review-target/pr-number)"

      - name: lens-maintainability
        type: agent
        agent: maintainability
        dependsOn: [load-target]
        task: |
          Read AGENTS.md and the relevant RFC-0001 sections. Review the staged
          .review-target/pr.diff and .review-target/pr.json only through the
          maintainability lens. Write the complete review to
          ops/reviews/$(date +%Y%m%d-%H%M)-pr$(cat .review-target/pr-number)-maintainability.md
          and git add it. The last non-empty line must be exactly REVIEW_PASSED
          or REVIEW_FAILED.
        verification: {type: output_contains, value: REVIEW_}
        maxIterations: 1
        timeoutMs: 1800000

      - name: lens-history
        type: agent
        agent: history
        dependsOn: [load-target]
        task: |
          Read AGENTS.md, ops/DRIVE-LOG.md, ops/NEXT.md, ops/DIRECTIVES.md when
          present, relevant RFC-0001 sections, and git log --oneline -40.
          Review .review-target/pr.diff through the history lens. Write the
          complete review to ops/reviews/$(date +%Y%m%d-%H%M)-pr$(cat
          .review-target/pr-number)-history.md and git add it. The last
          non-empty line must be exactly REVIEW_PASSED or REVIEW_FAILED.
        verification: {type: output_contains, value: REVIEW_}
        maxIterations: 1
        timeoutMs: 1800000

      - name: lens-structure
        type: agent
        agent: structure
        dependsOn: [load-target]
        task: |
          Read AGENTS.md and relevant RFC-0001 sections. Review
          .review-target/pr.diff through the structure lens: boundaries,
          coupling, single purpose, fail-closed behavior, and RFC vocabulary.
          Write the complete review to ops/reviews/$(date +%Y%m%d-%H%M)-pr$(cat
          .review-target/pr-number)-structure.md and git add it. The last
          non-empty line must be exactly REVIEW_PASSED or REVIEW_FAILED.
        verification: {type: output_contains, value: REVIEW_}
        maxIterations: 1
        timeoutMs: 1800000

      - name: persist-transcripts
        type: deterministic
        dependsOn: [lens-maintainability, lens-history, lens-structure]
        command: |
          set -eu
          PR=$(cat .review-target/pr-number)
          if ! git diff --cached --quiet -- ops/reviews/; then
            git commit -m "ops(review): persist PR #${PR} swarm transcripts" -- ops/reviews/
          fi

      - name: aggregate
        type: deterministic
        dependsOn: [persist-transcripts]
        command: |
          # Verdict selection and fail-closed rules live only in swarm-post.sh.
          .github/workflows/scripts/swarm-post.sh verdict .
        timeoutMs: 120000
