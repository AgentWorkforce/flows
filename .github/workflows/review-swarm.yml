name: Review swarm

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: review-swarm-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: ${{ github.event.pull_request.user.login == 'kjgbot' || github.event.pull_request.user.login == 'miyaontherelay' }}
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      RELAY_WORKSPACE_KEY: ${{ secrets.RELAY_WORKSPACE_KEY }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out PR merge commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0

      - name: Install agent-relay
        run: npm install --global agent-relay@11.8.7

      - name: Select review target
        run: printf '%s\n' "$PR_NUMBER" > .review-target

      - name: Start review swarm
        id: start
        shell: bash
        run: |
          set -euo pipefail
          response=$(agent-relay cloud run workflows/review-swarm.yaml --json)
          run_id=$(node -e 'const r=JSON.parse(process.argv[1]); if (!r.runId) process.exit(1); process.stdout.write(r.runId)' "$response")
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"

      - name: Wait for completion
        shell: bash
        env:
          RUN_ID: ${{ steps.start.outputs.run_id }}
        run: |
          set -euo pipefail
          deadline=$((SECONDS + 2700))
          while (( SECONDS < deadline )); do
            response=$(agent-relay cloud status "$RUN_ID" --json)
            status=$(node -e 'const r=JSON.parse(process.argv[1]); process.stdout.write(String(r.status || ""))' "$response")
            if [[ "$status" == completed ]]; then
              exit 0
            fi
            sleep 30
          done
          echo "review swarm timed out after 45 minutes" >&2
          exit 1

      - name: Sync and post reviews
        env:
          RUN_ID: ${{ steps.start.outputs.run_id }}
        run: sh .github/workflows/scripts/swarm-post.sh "$RUN_ID" "$PR_NUMBER"

