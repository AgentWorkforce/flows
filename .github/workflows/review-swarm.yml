name: Review swarm

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: review-swarm-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    # Ordering invariant: job 75m > poll deadline 65m > swarm timeout 60m.
    timeout-minutes: 75
    steps:
      - name: Check out immutable gate from main
        uses: actions/checkout@v4
        with:
          ref: main
          path: gate

      - name: Check out reviewed PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: target

      - name: Validate cloud authentication
        env:
          RELAY_WORKSPACE_KEY: ${{ secrets.RELAY_WORKSPACE_KEY }}
        run: |
          if [ -z "$RELAY_WORKSPACE_KEY" ]; then
            echo "RELAY_WORKSPACE_KEY secret not configured; see README §Review swarm cloud authentication" >&2
            exit 1
          fi

      - name: Install Agent Relay
        run: npm install --global agent-relay@11.8.7

      - name: Prepare immutable gate and PR evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: gate/.github/workflows/scripts/swarm-prepare.sh gate target "${{ github.event.pull_request.number }}"

      - name: Launch cloud swarm
        id: launch
        working-directory: target
        env:
          RELAY_WORKSPACE_KEY: ${{ secrets.RELAY_WORKSPACE_KEY }}
        run: |
          response=$(agent-relay cloud run .review-gate/review-swarm.yaml --sync-code --json)
          run_id=$(jq -r '.runId // .run_id // .id // empty' <<<"$response")
          if [ -z "$run_id" ]; then
            echo "LAUNCH_FAILED: cloud response did not contain a run id" >&2
            echo "$response" >&2
            exit 1
          fi
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"

      - name: Wait for terminal cloud status
        id: wait
        env:
          RELAY_WORKSPACE_KEY: ${{ secrets.RELAY_WORKSPACE_KEY }}
        run: |
          # Ordering invariant: poll deadline 3900s > swarm timeout 3600s.
          deadline=$((SECONDS + 3900))
          swarm_status=timed_out
          while (( SECONDS < deadline )); do
            status_json=$(agent-relay cloud status "${{ steps.launch.outputs.run_id }}" --json 2>/dev/null || true)
            status=$(jq -r '.status // empty' <<<"$status_json")
            case "$status" in
              completed|failed|cancelled)
                swarm_status=$status
                break
                ;;
            esac
            sleep 15
          done
          echo "swarm_status=$swarm_status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Sync evidence and update PR comments
        id: post
        if: always() && steps.launch.outputs.run_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RELAY_WORKSPACE_KEY: ${{ secrets.RELAY_WORKSPACE_KEY }}
        run: |
          sync_started=$(date +%s)
          gate/.github/workflows/scripts/swarm-post.sh \
            target "${{ github.event.pull_request.number }}" \
            "${{ steps.launch.outputs.run_id }}" \
            "${{ steps.wait.outputs.swarm_status }}" "$sync_started"

      - name: Enforce swarm result
        if: always()
        run: |
          [ "${{ steps.wait.outputs.swarm_status }}" = completed ] || exit 1
          [ "${{ steps.post.outputs.overall }}" = REVIEW_PASSED ] || exit 1
